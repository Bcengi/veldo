# Veldo document manifest.
# Drives PDF rendering (scripts/render_pdfs.py): footer stamping, output naming,
# and generation of the document map (VELDO_Documents.pdf). Versions are NOT
# stored here; each document carries its own version line, which the render
# script parses. This file holds what each document is FOR.

author: Dmitry Grinberg

documents:
  - file: method.md
    pdf: VELDO_Development_Method.pdf
    title: Veldo Development Method
    reading_order: 1
    purpose: The methodology itself - what Veldo is and why it works.
    audience: Everyone adopting or working under Veldo. Read this first.
    covers: >-
      Core model; foundational principles; the change lifecycle from intent to
      close; risk classification and the emergency lane; repository structure
      and the index; agent roles and human review lanes; agent operating
      instructions; definitions of proven and done; what Veldo eliminates and
      keeps; metrics; failure modes; adoption rules; the manifesto.

  - file: setup.md
    pdf: VELDO_Setup_and_Running.pdf
    title: Setting Up and Running Veldo
    reading_order: 2
    purpose: >-
      The operational companion - how to stand Veldo up and run it, from one
      person to an organization of thousands.
    audience: Whoever sets up or operates Veldo tooling, process, and platform.
    covers: >-
      The invariant architecture and the seven contracts with schemas; Claude
      Code setup; the scaling stages; the control plane and its build order;
      governance, safety, and economics; the edges (design, intake,
      documentation); anti-patterns; the two-week pilot and wave rollout.

  - file: plugin.md
    pdf: VELDO_Plugin_Guide.pdf
    title: Veldo Plugin Guide
    reading_order: 3
    purpose: >-
      Install Veldo into any repository in minutes - the plugin, the init
      command, and the first change.
    audience: Whoever installs Veldo into a repository or wants the component reference.
    covers: >-
      What the plugin carries (agents, skills, guard hook) versus what init
      lays down (the repository substrate); install commands; the first
      change end to end; what the guard enforces; the manual no-plugin path;
      upgrade rules; contents reference.

  - file: runbook.md
    pdf: VELDO_Runbook.pdf
    title: The Veldo Runbook
    reading_order: 4
    purpose: >-
      The complete operational manual - every change type, situation, and role,
      keystroke-exact; the document that takes a team from 0% to 100%.
    audience: Everyone operating under Veldo, daily reference.
    covers: >-
      Four full runbooks (backend feature, UI through the design lane, bug from
      a ticket, protected-path change with commit-bound approval); every change
      type with infrastructure as code first-class; every situation from a red
      gate to an emergency; every role's moments in the loop; administration
      (next repo, policy, standing specs, the weekly pass, upgrades, metrics);
      the cheat sheet.

  - file: change-management.md
    pdf: VELDO_Change_Management.pdf
    title: Changing to Veldo - The Human Transition
    reading_order: 5
    purpose: >-
      How to move every person to Veldo without firing anyone - resistance
      mapped role by role, the funded commitment, the phased program, the
      hard cases with scripts, and the program's own failure modes.
    audience: The founder and anyone leading the transition. Read before announcing anything.
    covers: >-
      The truth first (occupational redesign, the three-condition economic
      fact); the resistance map with counter-moves per role; the research
      base applied (established frameworks plus the 2024-2026 evidence and
      the 2026 additions); the program (the public commitment with exact
      words, the conversion cell, phases 0-4 with exit conditions, the
      sandbox for safe incompetence, the judgment ladder, pairing redesign,
      incentives and status protection, measurement without surveillance,
      the path for those who cannot or will not convert); five hard cases
      with founder scripts; thirteen program failure modes with tripwires;
      what never to do.

  - file: tracker-operator-guide.md
    pdf: VELDO_Tracker_Operator_Guide.pdf
    title: Working with Veldo and Your Tracker
    reading_order: 6
    purpose: >-
      The operator companion to the tracker integration - the human workflow
      for filing work from Jira or Confluence and the ticket round-trip that
      follows.
    audience: >-
      Anyone who files work from a tracker (Jira ticket or Confluence
      requirements page) and watches its status, working with Veldo.
    covers: >-
      Flagging a ticket or requirements page with a routing signal; running
      intake and what it drafts (a bug's reproduction as AC1, a page's
      acceptance criteria); the fail-closed refusal on a missing, unknown, or
      ambiguous signal; the one-way status mirror through the per-org
      status_map; epic and child structure for a plan; the one-way,
      repository-wins, never-poll rules; a full round-trip walked through once.
      Companion to Plugin Guide section 12.

# Training series: rendered into pdf/training/, listed on the map in their own
# section. Same rules: version line in each doc, stable filenames.
training:
  - file: training-guide.md
    pdf: VELDO_Training_Guide.pdf
    title: The Veldo Training Guide
    reading_order: 1
    purpose: The map of the series - who transforms, who dissolves, the shared core, the apprenticeship path, the minimum viable team.
    audience: Everyone; leadership first.
  - file: product-manager.md
    pdf: VELDO_Training_Product_Manager.pdf
    title: The Product Manager in Veldo
    reading_order: 2
    purpose: The most leveraged human role - intent and acceptance criteria as the product craft.
    audience: Product managers and product intent owners.
  - file: planning-layer.md
    pdf: VELDO_Training_Planning_Layer.pdf
    title: The Planning Layer in Veldo
    reading_order: 3
    purpose: The product manager's other half - driving a whole iteration through Product Plans, the DAG, and the frontier.
    audience: Product managers and product intent owners; anyone stewarding an iteration.
  - file: architect.md
    pdf: VELDO_Training_Architect.pdf
    title: The Architect in Veldo
    reading_order: 4
    purpose: The gate is the architecture - policy, protected paths, decomposition, contracts.
    audience: Architects and senior technical leaders.
  - file: backend-developer.md
    pdf: VELDO_Training_Backend_Developer.pdf
    title: The Backend Developer in Veldo
    reading_order: 5
    purpose: From typing to judgment - specs, proof literacy, gate engineering, the escalation seat.
    audience: Backend engineers.
  - file: web-developer.md
    pdf: VELDO_Training_Web_Developer.pdf
    title: The Web Developer in Veldo
    reading_order: 6
    purpose: The browser domain - the design contract, interaction evidence, baseline judgment.
    audience: Web engineers.
  - file: mobile-developer.md
    pdf: VELDO_Training_Mobile_Developer.pdf
    title: The Mobile Developer in Veldo
    reading_order: 7
    purpose: The runtime you cannot roll back - lifecycle evidence, containment, the upgrade matrix.
    audience: Mobile engineers.
  - file: infrastructure-engineer.md
    pdf: VELDO_Training_Infrastructure_Engineer.pdf
    title: The Infrastructure Engineer in Veldo
    reading_order: 8
    purpose: The 0-to-100 lever - everything into the repo, plan judgment, recovery as evidence.
    audience: Infrastructure and platform engineers.
  - file: qa-verification-engineer.md
    pdf: VELDO_Training_QA_Verification_Engineer.pdf
    title: QA in Veldo - the Verification Engineer
    reading_order: 9
    purpose: The most transformed role - criteria quality, the gate as a product, the exploratory lane.
    audience: QA engineers and SDETs.
  - file: project-manager.md
    pdf: VELDO_Training_Project_Manager.pdf
    title: The Project Manager and Veldo
    reading_order: 10
    purpose: The candid document - the role dissolves; the person has three real destinations.
    audience: Project managers and delivery leads.
  - file: designer.md
    pdf: VELDO_Training_Designer.pdf
    title: The Designer in Veldo
    reading_order: 11
    purpose: The mock as a contract, the verdict as a file - design judgment with teeth.
    audience: Designers and design leads.

map:
  pdf: VELDO_Documents.pdf
  title: Veldo Documents
