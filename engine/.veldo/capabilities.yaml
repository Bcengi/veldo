  tracker_request_reconcile:     {status: mechanical, home: .veldo/request_reconcile.py, scope: repo-only, note: the inbound command-and-receipt reconcile (WARP-0619, W5-logic of PLAN-0016) - the safety-critical path that turns a human's tracker decision into an AUTHORIZED settlement record in the repo, built and gate-proven ENTIRELY OFFLINE over a deterministic FakeTracker with a seeded changelog (no network, no live board; the real-board shape is proven separately in WARP-0620). The rule is COMMAND-AND-RECEIPT: a human's transition on the tracker is only a SUBMITTED ASSERTION. reconcile_requests (a repo-only sibling of the shipped reconcile_promotions) finds OPEN requests by the repo index (.veldo/requests/) plus the issue link plus a status query, NEVER by assignee==agent (the service account cannot be an assignee), pulls the ORDERED, ATTRIBUTED changelog through the WARP-0603 seam's new READ-ONLY read_changelog (each entry an id, ts, actor, from-state, to-state), and derives the TRUE actor and intent FROM THE CHANGELOG (the terminal transition entry and who made it), never from the current status. read_changelog is added to the TrackerAdapter base (NotImplementedError) and the FakeTracker (seed_changelog + read_changelog returning the seeded ordered attributed log, stored separately from the object's mutable state so it is read-only and never enters the write path); the live adapter reads the real board's issue history through the same seam, reference-wired and NEVER exercised in the gate. Before a decision settles it is VALIDATED against the shipped safety core with identities DERIVED and VERIFIED from the changelog/lineage (the verified proposer is the opening transition's actor, the terminal actor(s) the approving transition's) - NEVER a self-declared request field: authorization.is_authorized (reused UNCHANGED, composing the frozen two_key for an irreversible/money/external action and reading the same policy.yaml policy_check reads) requires the terminal actor be an authorized approver for the tier, separated from the verified proposer, and never the agent, with quorum, independence, and the second key where required; and the bound artifact digest RECOMPUTED FROM THE REPO must equal the displayed digest (a forged or stale binding is held). Any gap, conflict, or ambiguity (no attributable actor, both an accept and a reject terminal transition, an unresolvable proposer) BLOCKS - held, never inferred or defaulted-open. On a VALIDATED acceptance it writes the touchpoint settlement record (veldo.approval / veldo.decision / veldo.verdict, binding to the recomputed digest and naming the verified actor(s), carrying the request_id and changelog_id back-reference the frozen readers tolerate) and emits the event (request.accepted / request.rejected, plus decision.decided for an accepted decision_choice; the event vocabulary REUSED from request.py so it cannot drift) ONLY through an APPEND-ONLY COMPARE-AND-SWAP receipt keyed (request_id, changelog_id), so a re-run, a re-projection, or a duplicated changelog entry is a NO-OP and never double-applies. The repo is the single source of truth: the settlement record lands in the repo FIRST and setting the terminal tracker state is a downstream projection (W3), so this reconcile writes NO tracker state itself (the tracker surface is byte-unchanged after a run). The receipt store is an injected seam (the base owns the compare-and-swap; the gate drives an in-memory FakeSettlementStore, the reference FilesystemSettlementStore writes an append-only .veldo/receipts.jsonl plus the settlement record under .veldo/settlements/ and appends the event to .veldo/events.jsonl, wired per repo and NEVER gate-run). It composes the frozen safety core UNCHANGED and edits none of authorization.py / two_key.py / policy_check.py / decision.py; it touches no protected path; pure stdlib, no network on the gate path; it lays no timer, no daemon, and spawns nothing detached (NG1) - one pass per explicit invocation, never an always-on listener. Gate-tested via selftest driving the whole reconcile over the FakeTracker + FakeSettlementStore offline: a valid authorized-approver terminal transition settles once (record + event + receipt) and a re-run is a byte-identical no-op; an agent-made transition, a self-approval (terminal actor == verified proposer), a recomputed-digest mismatch, an irreversible action with no satisfied second key, and a conflicting changelog each BLOCK; and a duplicate (request_id, changelog_id) is a no-op - with in-memory source-mutation teeth (neutralizing the actor-from-changelog derivation lets a self-declared field drive it; neutralizing the proposer-from-changelog derivation lets a self-approval through; neutralizing the repo-digest recompute accepts a forged digest; neutralizing the compare-and-swap double-applies; neutralizing the conflict guard settles ambiguous input; neutralizing the authorized-only gate settles an unauthorized decision) each turning its assertion red while .veldo/request_reconcile.py on disk stays byte-unchanged. The live-board shape proof is the separate WARP-0620}
  pack_engine:                   {status: mechanical, home: .veldo/pack.py, scope: repo-only, note: the pack engine (PLAN-0008 W1) - assemble a self-contained VELDO pack from one canonical engine and prove no pack has drifted. .veldo/pack.py defines the ENGINE manifest (the tool-agnostic files every pack needs byte-identical), assemble_pack(engine_src, wrapper_src, agents_md, dest) produces a self-contained pack (engine copied byte-for-byte plus the tool wrapper plus the canonical AGENTS.md), and engine_drift(engine_src, pack_dir) names every engine file missing-from or differing-in a pack (empty means byte-identical) so the gate proves no pack forks - self-contained for the user, single source of truth for us. The canonical AGENTS.md (engine/AGENTS.md) carries the VELDO method and operating contract once for every tool. Pure stdlib file ops, gate-tested over temp trees with a non-tautology (drift empty when identical, named on a byte change or a missing file). Wiring it to the real plugin engine and creating the seven packs is W2 (Claude as a peer) onward}
  pack_drift_check:              {status: mechanical, home: scripts/check_pack_drift.py, scope: repo-only, note: the pack drift gate check (PLAN-0008 W2) - the Claude pack wired as the first peer and every declared pack's engine held byte-identical to the canonical source. .veldo/pack.py's ENGINE_GLOBS is finalized against the real substrate (engine): the guard script (scripts/veldo-guard.sh) and the whole runners tree are engine alongside the gate, .veldo modules and config, the CI workflow, and the spec/plan templates, and engine_files EXCLUDES build artifacts (__pycache__, .pyc) so the set is exactly the shipped source. A manifest .veldo/packs.json (veldo.packs/v1) declares each pack (tool, engine_src, pack_dir); load_packs validates it and rejects a malformed one by name (PackManifestError). scripts/check_pack_drift.py reads the manifest and reports, per pack, every engine file missing-from or differing-from its canonical source via engine_drift (WARP-0801, no second drift impl); empty is conformance, drift fails by name. It is ENFORCED IN THE GATE through the selftest (the unit check asserts pack_drift_report has no drift), not by editing the protected verify.sh; the standalone script is for a human and CI. Option B: through the build and the multi-tool packs v1 release, packs/claude/ IS the Claude pack in-place (its engine is the canonical source, so its drift is empty and honest); the optional later rename of packs/claude/ to packs/claude with a marketplace source repoint touches the protected .veldo/policy.yaml, so it is a separate human-approved change, deferred and not part of this release. Pure stdlib, no network; gate-tested via selftest with real teeth (an assembled pack has empty drift; a mutated engine file is reported differing and a removed one missing; a malformed manifest is rejected) and the real manifest asserted drift-free}
  pack_conformance:              {status: mechanical, home: .veldo/pack_conformance.py, scope: repo-only, note: the cross-pack conformance harness (PLAN-0008 W9) - the join point that turns "the packs were ported" into a property the gate enforces for every declared pack. Table-driven from .veldo/packs.json: for each pack it builds a throwaway repository from the pack's own git-archived tree (mode preserving) and drives the pack's push gate (the committed git pre-push hook where the pack ships one, else the guard directly for the option-B Claude pack) against a constructed unproven and a proven state, asserting the gate BLOCKS the unproven push and ALLOWS the proven one, that policy_check.py run standalone as CI runs it agrees, that the committed hook and guard are executable in the git INDEX (git ls-files -s, so a fresh clone gets an executable hook; git silently skips a non-executable one and an unproven push then fails open), and that no pack's engine has drifted. Both directions per pack is intrinsic teeth; a real git push to a local bare remote proves the exec bit is load-bearing end to end. Build machinery (repo-root .veldo/, not shipped engine, not copied into packs); pure stdlib, no network; enforced in the gate through the selftest}
  multitool_packs:               {status: mechanical, home: .veldo/packs.json, scope: repo-only, note: VELDO multi-tool packs v1 (PLAN-0008 W10 release) - seven self-contained drop-in packs assembled from one canonical engine, one per AI coding tool: Claude Code, Cursor, Codex CLI, GitHub Copilot, Antigravity CLI, OpenCode, and Aider. Each pack is a complete grab-and-go directory: the full canonical engine copied byte-identical (content and mode), the canonical AGENTS.md, and a thin tool-native driver (the tool config, its native hook where it has one, and always a git pre-push hook plus the CI required status check). The manifest .veldo/packs.json declares all seven; the mode-aware drift-check (pack_drift_check) holds every pack byte-identical to the source and the conformance harness (pack_conformance) proves every pack enforces the VELDO invariant identically. Claude Code is a peer pack, not a privileged base; enforcement is never weaker on any tool (the IDE cluster and hook-skipping Aider rest on the git pre-push plus CI backstop). One source for us, self-contained for the user, a red gate the instant any pack drifts}
  behaviour_floor_contract:      {status: mechanical, home: .veldo/behavior_floor.py, note: the behaviour floor (veldo.behavior_floor/v1, VELDO-0012) - the root of the legacy on-ramp. The machine may DRAFT a pin recording what a corner of existing code does today; it may NEVER rule on whether that behaviour matters. Every pin lands `unknown` (STATUSES has that single member) and a human rules load_bearing or present through the ticket channel. The pin's key set is CLOSED so there is nowhere to write a ruling inline, and a ruling resolves ONLY from a settlement joined by a digest the validator recomputes, so a granted ruling cannot be moved onto behaviour nobody looked at. RULING_NOT_SETTLED and RULING_NOT_CARRIED stay distinct because the fix is a different person's job in each case. Gate-wired via validate_checks.check_floors in run_all and FAILS CLOSED on a malformed floor; adoption safe, an absent .veldo/floors/ stands the check down and RECORDS that it did. .veldo/floors/* and .veldo/settlements/* are protected paths under Dmitry's recorded approval (proof/VELDO-0012/approval-dmitry.json), because without that the agent being gated could author the record that exempts it. IT ENFORCES NOTHING BEYOND WELL-FORMEDNESS: no change is refused because a pin is unknown or blocked, and no gate stage so much as READS a disposition (asserted over the derived gate closure). The precondition at ready and at claim is a later item}
  release_contract_registry:     {status: mechanical, home: .veldo/release_contract.py, note: the release contract and its registry (veldo.release/v1, VELDO-0011) - the unit above the plan. A release GROUPS plans, and a member is bound by the member file's BYTES rather than its front matter, so a plan body rewritten after the binding no longer matches (plan_hash truncates to 16 hex over front matter with approved_at dropped, which is a hole exactly the size of a plan body; a binding digest keeps all 64). A duplicate release id, a duplicate plan id, a member claimed by two releases, a member cycle and two releases claiming mvp are each refused under their own named cause. Gate-wired via validate_checks.check_releases in run_all, which also refuses a duplicate plan id; adoption safe, an absent releases/ stands the registry check down and records it. NOT to be confused with .veldo/release.py, which is deploy rollout automation}
  work_state_after_a_loss:       {status: mechanical, home: .veldo/work_state.py, note: what is done, what nobody concluded, and what is queued (VELDO-0002, PLAN-0018 W1) - the answer after a session dies. Holds NO state and writes nothing: it JOINS the corpus artifacts (which say what finished) to runlog's per-run registry under the git common dir (which says what was claimed), because neither answered alone. THE ARTIFACTS DECIDE DONE AND A RUN'S OWN WORD NEVER DOES: a run recording status done for a spec with no bundle reads UNCONCLUDED with the folder to look in, and a manifest with no verdict is mid-write rather than finished. A run whose liveness cannot be confirmed is LIVENESS_UNCONFIRMED WITH THE HEARTBEAT AGE, never running and never dead, because it reads a heartbeat written by a process it cannot see. Reports disagreement in BOTH directions: a claim with no artifacts, and artifacts NO run ever claimed - the second being the shape a dead session leaves behind and invisible to any reader that walks only the registry. GATES NOTHING and is run by an operator (`python3 .veldo/work_state.py report`); no gate stage loads it, so a missing copy cannot redden a gate run}
  non_construction_work_source:  {status: reference, home: .veldo/tasks.py, note: a work source for work that is NOT construction (veldo.tasks/v1, VELDO-0003, PLAN-0018 W2) - review, audit, authoring, investigation and migration become claimable units. IT ADDS NO SECOND FLEET, deliberately: the elastic control loop, the token governor, the in-session spawner and the resume waiter already exist and are already governed, so this supplies a work source plus a TaskController satisfying the EXISTING FleetController contract, and an AST scan asserts the module references no spawner, no sleep and no pacing primitive (desired, resume_at and now are injected). Proven by driving fleet.veldo_fleet over a task queue with fleet.py untouched. Two workers never get one task because claimability is answered by the EXISTING .veldo/claim.py under its own per-unit lock, never a second mechanism. DONE IS THE PRODUCT EXISTING, never a status a worker wrote, which also makes a dead worker harmless: the ledger ages the stale claim out and the task returns to the queue. `build` is deliberately not a kind - the frontier is already construction's work source. REFERENCE because the queue ships and the fleet CALLER is wired per repo; no gate stage loads it}
  promise_corpus:                {status: reference, home: .veldo/promises.py, note: the promise corpus (veldo.promises/v1, VELDO-0004, PLAN-0018 W3) - a claim a document makes, settled mechanically against the tree. Motivated by a measurement: on 2026-08-10 an audit of this project's own shipped documents found 64 false claims across 8 documents with the gate green throughout, because those claims lived in prose and the gate reads code. EXTRACTION IS NOT HERE: deciding which sentences make checkable claims is a judgement call and a machine faking it produces exactly that class of wrongness, so extraction is an authoring task and its product is a claim record with a DECLARED predicate from a deliberately tiny vocabulary (path presence, text presence, text absence, symbol definition, and an honest `unsettleable`). A CONTRADICTION CARRIES WHAT IT MEASURED - the predicate, the target read, and what was found - recorded for SUPPORTED claims too, because the audit that motivated this had FIVE OF FIFTEEN accusations overturned on challenge and an accusation without its evidence is indistinguishable from a correct one. UNSETTLEABLE is first-class and never folded into supported; a target that cannot be READ settles unsettleable, never contradicted. No score, ratio or percentage is printed. GATES NOTHING (PLAN-0018 NG3: an organ that blocked on a heuristic verdict would cut true sentences and stop real work); REFERENCE because the validator ships and the corpora are authored per repo}
  declared_versus_shipped:       {status: reference, home: .veldo/declared.py, note: where the capability manifest and the tree disagree (VELDO-0005, PLAN-0018 W4) - two findings, never merged, because they are opposite mistakes with opposite fixes. HOME_UNRESOLVED: the manifest claims a home the tree does not have. UNDECLARED_MODULE: the tree ships a module the manifest never claims. THE RESOLVER IS THE ITEM: measured 2026-08-12 against this repository's real manifest, checking each home as one path under the repository root reported 42 unresolved of 167 and ALL 42 WERE FALSE, because a home may be COMPOUND (`a.py + b.py`), may be a DIRECTORY, and may live under a pack root. So the resolver splits compounds, tries every declared root and accepts a directory, and every finding records WHAT IT TRIED - an accusation against the file documentation defers to would otherwise send somebody editing a correct declaration. An exemption carries a REASON (one without is refused) and exempted modules are counted in their OWN bucket, never added to the declared count, so the report cannot be made clean by exempting everything. A design-with-no-descendants leg is DELIBERATELY NOT BUILT: this repository has no design/ directory, so it would ship unexercised. GATES NOTHING (PLAN-0018 NG3); REFERENCE because the read model ships and the exemption list is authored per repo}
  budget_state_for_an_operator:  {status: reference, home: .veldo/budget_state.py, note: budget continuity on the path an operator actually takes (VELDO-0006, PLAN-0018 W5) - a read model that paces nothing and exists to refuse one sentence. MEASURED 2026-08-12: the live event stream carries ZERO events with a spend field, so governor.windowed_spend returns 0.0 for every window and the obvious report would announce that the whole budget remains; the truth is that nothing was ever recorded, and those invite opposite decisions. So a window with no recorded spend inside its horizon is UNMEASURED with no remaining figure quoted at all. It also names the POSTURE, because the governor's bootstrap path PERMITS max_workers when burn is unmeasured - correct for the governor and dangerous silent, since in this repository burn has never been measured and the pacing PLAN-0018 promises has therefore never paced anything here. Three postures, never collapsed: PACING (derived from measured burn), BOOTSTRAP (a permission, not a pace) and SPENT (zero until the window rolls, with the governor's resume time). EVERY NUMBER COMES FROM .veldo/governor.py by calling it - windowed_spend, desired_workers, resume_at and Window.target_rate - and the suite asserts equality against those functions directly, because a second implementation of the pacing arithmetic is this repository's most repeated defect. It also names WHAT SURVIVES STOPPING, measured: concluded work as artifacts on disk, and claimed units whose claims age out of the ledger and return to the queue (the VELDO-0002 and VELDO-0003 properties), reporting UNKNOWN rather than zero when the ledger cannot be read. Asserted by AST scan to reference no sleep, spawn, waiter or retirement. GATES NOTHING; REFERENCE because the read model ships and the windows are configured per repo}
  install_and_run_smoke:         {status: mechanical, home: scripts/check_install_and_run.py, scope: repo-only, note: install and run, proven from the artifact an adopter receives (VELDO-0007, PLAN-0018 W6) - the only check whose subject is a stranger's tree rather than this one. Veldo 1.0.0 could not be initialised by anyone: /veldo:init failed from every composed pack with "gate template drift" and laid nothing, because in this repository the template base is a separate tree at engine/ while in a COMPOSED PACK the base has been laid INTO the pack, so the pack root IS the template source and there is no engine/ at all. The recorded reason it shipped is one sentence: nothing had ever run init from a composed pack, because every test runs against this repository, the one tree nobody installs. So this composes with the REAL publisher into a temporary directory, runs the COMPOSED PACK'"'"'S OWN scaffolder, and requires the scaffolded repository'"'"'s OWN scripts/verify.sh to exit zero - asserting the tree it installed from has no engine/ directory, because that absence is the condition that broke. The pack set is DERIVED from what the publisher composed with set equality asserted, never typed, and a produced tree with no composed pack is NO_PACKS_COMPOSED and red rather than a vacuous pass over an empty loop. Four named failures: COMPOSE_FAILED, NO_PACKS_COMPOSED, INIT_FAILED, ADOPTER_GATE_RED, and a failing result QUOTES init'"'"'s output or the adopter'"'"'s own gate tail. Teeth driven by corrupting a required substrate file inside a real composed pack and requiring a named failure. Measured at about 2 seconds for all seven packs. Writes only inside a temporary directory it removes, asserted by this repository'"'"'s git status being unchanged across a run; makes no network call and starts no detached process (AST-asserted). REPO-ONLY, corrected by this repository's own capability-honesty check: the script does not ship, and an adopter does not publish packs, so the stage belongs to the veldo home gate alone rather than the shipped template. NOT YET A CATALOG ITEM: declaring the slot edits scripts/verify.sh, a protected path needing a recorded approval, so AC5 REPORTS until that lands and REFUSES after}
  version_from_one_declaration:  {status: mechanical, home: .veldo/version.py, note: what this installation is, from ONE declaration (VELDO-0008, PLAN-0018 W7). MEASURED 2026-08-12: three tracked files declare this project's version and the one shipped assertion covering them named TWO, so packs/antigravity/plugin.json had never been checked by anything - the hand-listed-pair defect this repository has now shipped three times (seven template pairs guarding nine modules, two scaffolder lists each missing two organs, two named manifests out of three). So the manifest set is DERIVED from git ls-files by filename, with fixture manifests excluded and the reason declared, and a pack added later is covered by ARRIVING rather than by being remembered. THE CANONICAL DECLARATION is .claude-plugin/marketplace.json, the file an adopter installs from, chosen rather than inventing a fourth declaration. NO GUESSED VERSION EVER: an absent or unreadable canonical file refuses with VERSION_CANONICAL_ABSENT and returns no version, because an installation reporting a number it invented sends a bug report to the wrong tree, and the CLI exits NON-ZERO on that path so a caller capturing output cannot silently receive a guess. A disagreement names BOTH manifests and BOTH versions, because which side is wrong is not always the copy. An unparseable manifest is its own finding, separate from a disagreement, because the fix differs. A tree with one manifest reports agreement over a set of ONE with the count named. Its live rows assert set membership and agreement, never a version number, so the next release cannot redden them}
  install_stamp_and_drift:       {status: mechanical, home: .veldo/init_scaffold.py + .veldo/version.py, note: init stamps what it laid down, and the drift detector that gives the stamp a purpose (VELDO-0009, PLAN-0018 W8). An adopter installs the substrate, reads the documentation months later, and until now had no way to know whether the code in their repository is the code that documentation describes. /veldo:init now GENERATES .veldo/installed.json recording the version, the moment and the templates path it was laid from. GENERATED, NEVER A COPIED TEMPLATE, and not as a style choice: a template must be tracked and published, and this session found what happens when the scaffolder demands a template the published pack does not carry - every install fails with "template missing", the 1.0 defect exactly. CREATE-ONLY like everything else the scaffolder lays, so a re-run leaves the FIRST install's record byte-identical rather than erasing the evidence of drift at the moment somebody looks for it. NO STAMP IS BETTER THAN A STAMP THAT GUESSES: templates declaring no version produce nothing at all, and the version is searched across the THREE REAL SHAPES plus the templates' parent, because assuming one shape is what made 1.0 uninstallable. THE DETECTOR HAS FOUR ANSWERS AND NONE COLLAPSES: UNSTAMPED, VERSION_STAMP_UNREADABLE (something wrote there and the fix is to look at it), VERSION_NOTHING_TO_COMPARE and VERSION_SUBSTRATE_DRIFT naming BOTH versions. The third is the one that would have been a false alarm: a scaffolded repository carries the stamp and no marketplace manifest because it is not a marketplace, so the comparison cannot be made from inside that tree at all - reporting no drift would clear an install nobody measured and reporting drift would accuse every adopter, so the caller passes the version they can install from now}
  evidence_provenance:           {status: mechanical, home: .veldo/version.py, note: evidence names the version that produced it (VELDO-0010, PLAN-0018 W9). A proof bundle records that a criterion was met and did not say WHICH version of the method produced it, so evidence written when the checks were weaker was indistinguishable from evidence written now. MEASURED 2026-08-12: 143 bundles exist and NONE carries a producing version, so the `veldo_version` field is OPTIONAL BY CONSTRUCTION - absent from PROOF_REQ, every existing bundle validating unchanged - because requiring it would have reddened a working repository on the day it landed, which is how a correct rule gets reverted. NOTHING IS INFERRED for a bundle that does not say: reporting today version for older evidence would state exactly the fact the field exists to establish, so an absent field is UNVERSIONED, appears under no version, and the report says in words that nothing was inferred. A present field is checked for SHAPE and NEVER for equality with the current version, because a bundle produced by an older version legitimately carries an older version - a check demanding agreement would make the field useless the first time it was true. The counts PARTITION the corpus exactly, so a reader can tell how much of the evidence the answer covers. THE GATE-OUTPUT HALF IS SPECIFIED AND NOT WRITTEN: the gate stamps .veldo/last_verify from scripts/verify.sh, a protected path needing a recorded approval, so AC5 reports the true state and carries an invariant with teeth against a HALF-DONE registration - if the gate mentions a producing version it must actually write the key}
