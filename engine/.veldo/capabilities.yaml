# VELDO capability manifest: the machine-readable truth about what this plugin
# release actually implements. Documentation defers to this file; a claim in
# prose that contradicts a status here is a documentation bug.
#
# status vocabulary:
#   mechanical      enforced by shipped code, fails closed
#   reference       a shipped reference implementation, must be wired per repo
#   procedure       agent-instructed behavior (skills/prompts), not enforced
#   absent          documented as target behavior, nothing ships yet
#   control-plane   deferred by the setup guide's build order, honestly later

capabilities:
  gate_catalog_fail_closed:      {status: mechanical, home: scripts/verify.sh, note: undeclared or blank items make the gate red; waivers expire}
  secret_detection:              {status: mechanical, home: scripts/verify.sh, note: narrow regex; a real scanner belongs in the security slot}
  contract_structural_checks:    {status: mechanical, home: .veldo/validate.py, note: field/enum checks; not full schemas or digests}
  required_evidence_coverage:    {status: mechanical, home: .veldo/validate.py, note: declared kinds must appear in proof; unknown kinds fail}
  criteria_coverage:             {status: mechanical, home: .veldo/validate.py, note: spec criteria = proof criteria; invented or duplicate ids fail}
  architecture_contract:         {status: mechanical, home: .veldo/arch.py, note: the architecture contract validator (PLAN-0011 W1) - structurally validates .veldo/architecture.yaml (veldo.arch/v1) the way a plan is validated: required fields, closed vocabularies, unknown rule kinds rejected at contract time, dependency edges resolving to declared areas, and the governance that the shape leaves draft only by a recorded human approval. Fails closed on a malformed or referenced-but-absent contract and stands down (adoption safe) when no contract exists, so a repository without one is byte-identically unaffected. Gate-run via validate.py all and gate-tested with mutation teeth in selftest (WARP-1101). The contract ARTIFACT itself is per-repo (this repo carries its own approved seed as the first instance) and is not part of the shipped engine; gate ENFORCEMENT of the mechanizable shape rules against the source is WARP-1102}
  foundational_decision_record:  {status: mechanical, home: .veldo/decision.py, note: the foundational decision-record validator (PLAN-0011 W5) - structurally validates .veldo/decisions/*.yaml (veldo.decision/v1) the way a plan and the architecture contract are validated: required fields, closed vocabularies (status, reversal-cost class, risk tier), an option rejected at record time when it lacks its dead-end condition, assumptions each requiring a measurable signal and a breach condition (so they can become living tripwires), the governance that a foundational choice is decided only by a recorded human (a decided record needs a decider and a chosen option that resolves; a draft needs none; no machine-decided state), and the D5 mapping that an irreversible choice must sit at the critical risk tier. Fails closed on a malformed record, a duplicate id across records, or a required-but-absent record, and stands down (adoption safe) when no .veldo/decisions/ directory exists, so a repository without records is byte-identically unaffected. Gate-run via validate.py all and gate-tested with mutation teeth in selftest (WARP-1105). The decision RECORDS themselves are per-repo and are not part of the shipped engine; the adversarial decision review is WARP-1106 and the in-session tripwire pass over the assumption signals is WARP-1107}
  human_touchpoint_request:      {status: mechanical, home: .veldo/request.py, note: the human-touchpoint request envelope (veldo.request/v1) and its structural validator (PLAN-0016 W2) - a THIN ENVELOPE, sibling of .veldo/decision.py, that REFERENCES a shipped settlement record (veldo.approval/v1, veldo.decision/v1, or veldo.verdict/v1) by path and never extends it, so the frozen safety-core readers (policy_check.py, two_key.py, decision.py) stay byte-compatible and the outbound projection (W3), the inbound command-and-receipt edge (W5), and the authorization/quorum logic (W6) build on ONE schema. The record carries id, request_hash, touchpoint, tier, impact, required_roles, quorum, expires_at, supersedes/superseded_by, bound_artifact, settlement, tracker, and status; closed vocabularies are validated FAIL CLOSED by name - touchpoint in {spec_approval, plan_approval, decision_choice, review_disposition, risky_action_authorization, escalation}, tier in {low, standard, high, critical}, status in the request lifecycle set (open, in_discussion, awaiting_approval, needs_decision, changes_requested, blocked, accepted, rejected, superseded), and impact entries in {data_mutating, money, external, irreversible} (FLAGS, never a fifth tier). request_digest(record) is the ONE canonical integrity hash over the request substance (parallel to policy_check.proof_digest and action_executor.proposal_digest), SEPARATE from bound_artifact.digest, which is POLYMORPHIC per touchpoint (the commit(s)+paths an approval binds on, the proposal digest a risky action binds on, the veldo.decision/v1 record digest a decision-choice binds on) and is NEVER fed to a frozen reader. Two derivations are enforced: an irreversible impact maps to the critical tier (consistent with decision.py), and a decision_choice request's tier is DERIVED from the bound decision's risk (the single derivation, checked when the bound decision resolves), not set independently. check_requests_dir(root, parse, fail) validates every .veldo/requests/*.yaml record STRUCTURALLY, wired into validate.py run_all in the EXACT adoption-safe, fail-closed, dependency-free style of decision.check_decisions_dir (the front-matter parser and the failure reporter are passed in, no second YAML parser, no import cycle): an absent .veldo/requests/ directory stands the check down and returns clean (a repo that never uses the surface is byte-identically unaffected), a present malformed record fails closed by name (a bad schema, an out-of-vocabulary touchpoint/tier/status/impact, a missing required field, a non-positive version, an accepted request whose bound_artifact carries no digest to bind on, or a settlement record path that does not exist), and a duplicate request id across the set is refused by name. The event vocabulary (.veldo/events.py) gains request.opened, request.accepted, request.rejected, request.superseded, and decision.decided, owned here as REQUEST_EVENT_TYPES and bound by a selftest drift-guard so the contract and the emitter cannot drift (a conscious contract change). The optional back-reference fields request_id and request_hash may ride a veldo.approval/v1, veldo.decision/v1, or veldo.verdict/v1 record and the shipped readers TOLERATE them (they ignore unknown fields, proven by a selftest asserting policy_check.valid_approval_for, two_key.authorize, and decision.validate_record still accept a back-ref'd record); this spec adds the fields' MEANING and the tolerance proof and modifies NONE of the three reader modules. The RECORDS are per-repo (.veldo/requests/, a directory the engine glob does not sweep) and are not shipped in the engine. Dependency free (pathlib, plus json and hashlib for the request's own digest) and starts no process, thread, or timer. Gate-tested with positive controls (a well-formed request of each touchpoint validates; the frozen readers accept a back-ref'd record) plus the fail-closed cases and anti-vacuity teeth (neutralizing the closed-vocabulary check lets a bad touchpoint pass; neutralizing the duplicate-id guard lets two records share an id; neutralizing the accepted-requires-bound-digest check lets an unbound accepted request pass) each turning its assertion red while .veldo/request.py stays byte-unchanged, in selftest (WARP-0615). The outbound projection is WARP-0617 (W3), the inbound edge WARP-0619 (W5), and the authorization/quorum logic WARP-0616 (W6), all honestly out of scope here - this builds the envelope, its digest, its fail-closed validator, and the event vocabulary, and nothing else}
  human_decision_authorization: {status: mechanical, home: .veldo/authorization.py, note: the authorization module for the human-decision surface (veldo.authorization/v1, PLAN-0016 W6) - the PURE functions that decide whether a veldo.request/v1 human decision is authorized, a sibling of .veldo/decision.py / .veldo/two_key.py / .veldo/policy_check.py distributed byte-identical across all eight engine copies (root + engine + 6 packs) the way request.py and two_key.py are. required_roles(touchpoint, tier) and quorum(tier) -> {count, min_independence} read a human_decisions block from .veldo/policy.yaml read-only (the way policy_check.py reads that same file, reusing the ONE front-matter parser for the block and shipping no second parser), and is_authorized(request, attestations, approver_registry) -> a structured decision {authorized, reason, and the evidence the outcome rests on} decides the request. IT SHIPS INERT: the human_decisions block is ABSENT from every shipped policy.yaml, so is_authorized returns authorized=False for EVERY request until the block is added under a SEPARATE protected-path approval (VEL-3); an absent OR malformed block FAILS CLOSED (authorizes nothing, never open). ANTI-RUBBER-STAMP: an approval counts only with a STRUCTURED attestation (a non-empty rationale, an explicit risk_acceptance, and a finding_disposition for a review-disposition touchpoint), never a bare yes; per-request (no bulk or blanket approve); and a MATERIAL CHANGE to the bound artifact digest INVALIDATES a prior attestation (denied until re-attested). SEPARATION OF DUTIES + QUORUM: an authorizing approver MUST differ from the request producer/proposer and can NEVER be the agent or a service account (the machine actors two_key refuses, mirrored here and bound by a selftest so the two cannot drift); quorum.count DISTINCT approvers are required (one identity is never counted twice) and min_independence distinct independence groups are enforced. For a request whose impact is irreversible, money, or external the FROZEN two_key.authorize contract (KEY 1 a recorded human authorization and KEY 2 an independent fresh-context confirmation, each bound to the proposal digest) MUST additionally be satisfied, reused UNCHANGED (no second gate). It touches NO protected path (it does not edit policy.yaml), modifies none of the frozen readers (policy_check.py, two_key.py, decision.py), reads policy.yaml read-only and writes nothing, holds no credential, opens no connection, and starts no process, thread, or timer (NG3, no-detach). Dependency free (pathlib and json at module top; importlib lazily, only when a policy block is present or the two-key path is reached). Declared in the engine area of .veldo/architecture.yaml. Gate-tested with positive controls (a well-formed request authorizes; an irreversible request with both keys authorizes) plus the fail-closed cases and anti-vacuity teeth (neutralizing the fail-closed config gate authorizes an unconfigured request; neutralizing the separation check authorizes a self-approval; neutralizing the digest-invalidation authorizes a stale attestation; neutralizing the quorum count authorizes a short quorum; neutralizing the two-key requirement authorizes an irreversible action without the second key) each turning its assertion red while .veldo/authorization.py stays byte-unchanged, in selftest (WARP-0616). The inbound command-and-receipt edge that DRIVES a request through this matrix and records the settlement is WARP-0619 (W5), honestly out of scope here - this builds the matrix, and only that}
  adversarial_decision_review:   {status: mechanical, home: .veldo/decision_review.py, note: the adversarial decision-review validator, the delegated fresh-context reviewer seam, and the decided-requires-review gate (PLAN-0011 W6) - a foundational choice is attacked by a fresh context before a human commits to it. A veldo.decision_review/v1 artifact under .veldo/decision_reviews/*.yaml binds to a decision record (its id and the decision_version reviewed) and records the attack on the framing: a problem-class challenge (is the problem class stated honestly, not anchored to today's scale), a per-option challenge (does each option's dead_end hold), missing-option findings, and a per-assumption challenge (are the recorded assumptions the real load-bearing ones), plus a recommendation and a disposition for the human. validate_review (in .veldo/decision_review.py, invoked from validate.py) checks it structurally the way decision.py checks a record - closed vocabularies for the disposition and each verdict, a finding required on every challenge, and a review that smuggles a chosen option or a decider refused because a review INFORMS and never decides (O4, NG2); bind_review fails closed when the referenced decision is malformed or absent, when the decision_version does not match the record, or when the challenges do not cover every option and assumption the decision declares. The fresh-context reviewer is a DELEGATED seam (AdversarialReviewer, reference LiveAdversarialReviewer) that FAILS LOUD, so no review is fabricated in code, mirroring the executor.LiveLoop.review and dispatch.LiveReviewer seams. decided_requires_review enforces that a decision may move to decided only once it carries at least the number of bound, valid adversarial reviews its risk tier requires, read from .veldo/policy.yaml risk_tiers (the single source of truth), so an irreversible choice W5 maps to the critical tier needs two independent reviews (D5) and a standard tier needs one. Adoption safe: no .veldo/decisions/ directory stands the whole gate down, so a repository with no decision records is byte-identically unaffected. Gate-run via validate.py all and gate-tested with mutation teeth over the shipped decision-review-example.yaml plus temp-tree gate fixtures in selftest (WARP-1106). The decision REVIEWS themselves are per-repo (.veldo/decision_reviews/, not shipped in the engine); the in-session tripwire pass over the decision's assumption signals is WARP-1107 (W7)}
  decision_tripwires:            {status: mechanical, home: .veldo/tripwire.py, note: decision tripwires monitored in-session (PLAN-0011 W7) - a foundational decision's assumptions are living tripwires, and a pure in-session evaluator fires when one breaches, so a wrong foundation is caught by ASSUMPTION BREACH rather than by an outage later. Per resolved decision D3 the signal source is a small recorded-readings file the session updates in-session at the weekly pass, homed per-repo under .veldo/readings/*.yaml (a directory the engine glob does not sweep) and naming the decision it measures; each reading is a MEASURED shape (a value plus a machine-comparable breach_when comparator and threshold, optionally an approaching_when early-warning) or a MANUAL_REVIEW shape (a human attestation with a valid_days expiry). evaluate_readings/evaluate_tripwires (in .veldo/tripwire.py, invoked from validate.py check_tripwires in run_all and the tripwires CLI mode) monitor only DECIDED records, mechanically compare each assumption's signal against its breach at an INJECTED current date, and FAIL CLOSED on a malformed readings set (wrong schema, an unknown assumption reference, an out-of-vocabulary kind, a measured reading missing its value or breach_when or with an unparseable comparator, a manual-review missing its fields, a readings file naming a decision no record declares) and on a FIRED tripwire (a breached measured reading or a lapsed manual-review), surfacing each as a named finding in ALL THREE of the surfaces the plan names: the gate output (validate.py check_tripwires in run_all fails closed), veldo status (the loop-area runstatus reader projects the same evaluation through validate.tripwire_status over the allow-listed loop -> contracts edge, so veldo status and veldo status --serve show a fired foundation as a named finding), and the weekly pass (the tripwires CLI run in-session, which also drafts the re-decision); an approaching-breach or an unmonitored assumption surface as a warning without failing. IN-SESSION ONLY, NOTHING DETACHED (NG1, the contract invariant no_detached_processes, feedback_no_rogue_processes): the evaluator is a pure function that reads recorded files and starts no process and no thread and installs no timer, proven by a source string-scan-with-mutation tooth in selftest. A fired tripwire hands to the re-decision loop: draft_redecisions writes exactly ONE veldo.redecision/v1 DRAFT per breached decision under .veldo/redecisions/ for a HUMAN to promote (NG2 - the machine drafts, never decides, never re-platforms), idempotently (a second run drafts no duplicate). Adoption safe: no .veldo/decisions/ directory stands the pass down, so a repository with no decision records is byte-identically unaffected. Gate-run via validate.py all and gate-tested with mutation teeth over the shipped readings-example.yaml plus temp-tree seeded-breach and idempotency fixtures in selftest (WARP-1107). The readings and re-decision drafts are per-repo (not shipped in the engine); the ENTROPY cost-to-change metrics and restoration-spec generation for the decay class are WARP-1108/WARP-1109 (W8/W9)}
  spec_placement_footprint:      {status: mechanical, home: .veldo/arch.py, note: placement and footprint at elaboration (PLAN-0011 W3) - a spec declares in its front matter a placement (one or more architecture-contract area ids the change lands in) and a footprint (the path globs it is allowed to touch). validate_placement (in .veldo/arch.py, invoked from validate.py check_spec) checks a declared placement structurally against the contract's areas. The MANDATORY gate placement_gate (in .veldo/arch.py) enforces the O3/RJ2 property at the transition and the claim, never as a corpus sweep: when a contract exists a spec may not REACH ready (validate.py check_ready, the ready CLI mode, run by the /veldo:spec skill) and is never CLAIMED for build (frontier.claimable filters it, plan.py run-check refuses it) unless it declares a placement that resolves to a declared area, and a footprint that crosses an UNMODELED area boundary (its touched areas contain a pair with no allow-listed dependency edge between them in either direction, footprint_tier_floor) raises the required risk tier to at least high and nothing lowers it, while a pair the contract's dependencies.allow already connects is cohesive breadth and does NOT elevate (refined by WARP-1011 on 2026-07-22, a founder decision, so the tier signal marks a genuine boundary crossing rather than mere breadth). Adoption safe: no contract in the repository stands the whole gate down, so a contract-free repository is byte-identically unaffected and the already-shipped corpus (past ready and claim) is never re-evaluated and needs no migration. This spec (WARP-1103) itself declares placement area contracts and its footprint touches the fleet area (it edits frontier.py); it shipped at recorded risk high, unchanged and forward-only, though under the refined rule the contracts and fleet pair is connected by the allow-listed fleet-to-contracts edge, so it is cohesive breadth rather than a boundary crossing. Gate-run via validate.py all (the optional structural check) and gate-tested with mutation teeth over the real WARP-1103 spec plus a no-corpus-sweep guard in selftest. Honest boundary: enforcing the footprint against the actual diff, and detecting a genuinely new module, is the gate-time diff machinery of WARP-1102 (W2); grading whether a change fits the declared shape is the shape-fit review dimension WARP-1104 (W4)}
  shape_fit_review:              {status: mechanical, home: .veldo/shape_review.py, note: the shape-fit review dimension (PLAN-0011 W4) - the independent review grades a SECOND dimension beyond spec-conformance, does this change FIT the declared architecture shape, and correct-but-does-not-fit is a legitimate rework verdict (D4, a misfit blocks the merge like any blocking finding from day one). The dimension is honestly split. MECHANICAL and fail closed, mechanical_shape_findings (in .veldo/shape_review.py, invoked from validate.py check_json for a verdict's shape_fit block and from validate.py check_shape_review plus the shape-review CLI mode) decides from the contract plus the spec's placement/footprint plus the diff's paths the rules that need no judgment, a placement area that does not resolve to a declared area, a diff path outside the declared footprint (a change may not silently touch a path it never declared), a diff path resolving to a declared area outside the declared placement (the footprint does not stay within the declared areas), and a diff that couples two declared areas with no allow-listed dependency edge between them (an unmodeled boundary crossing the contract does not sanction); it reuses arch.area_for_path, arch.area_ids, and the dependency-graph helpers (no second placement or boundary implementation). DELEGATED and fail loud, whether the change follows the declared PATTERNS of the areas it touches is a judgment no mechanical rule can settle, so ShapeReviewer.review is a fresh-context seam and the reference LiveShapeReviewer RAISES ShapeReviewError rather than fabricate a judgment, mirroring the executor.LiveLoop.review and dispatch.LiveReviewer seams (NG5, nothing mechanizable that nothing enforces). build_shape_fit assembles the shape_fit block the verdict carries and the MACHINE NEVER LOWERS (any mechanical misfit forces does_not_fit regardless of the judgment; a malformed or fabricated judgment is refused by name). The merge gate reads the dimension through shape_fit_blocks (a does_not_fit or malformed block blocks; a verdict with no shape_fit dimension does not, adoption safe), wired into dispatch._verdict_passes over the allow-listed fleet -> contracts edge so a correct-but-misfit verdict is refused at the merge choke point and the spec returns to fail_status for rework. validate_shape_fit checks the verdict's shape_fit block structurally and fails closed on an out-of-vocabulary verdict, a non-list mechanical list, a malformed review sub-block, or a does_not_fit that names no finding. Gate-run via validate.py all (verdict shape_fit validation) and gate-tested with mutation teeth over the mechanical rules, the machine-never-lowers rule, the delegated fail-loud seam, and a dispatcher conformance fixture (a correct-but-misfit verdict refused, a fitting one shipped) in selftest (WARP-1104). Enforcing the declared footprint against the diff as a red GATE check in verify.sh is the separate gate-time organ WARP-1102 (W2); the entropy metrics and restoration for the decay class are WARP-1108/WARP-1109 (W8/W9)}
  shape_gate_enforcement:        {status: mechanical, home: .veldo/shape_gate.py, note: gate-time enforcement of the mechanizable shape rules (PLAN-0011 W2) - a shape check wired thin into scripts/verify.sh (a single call, the logic in .veldo/shape_gate.py) that reads .veldo/architecture.yaml and, for every rule the contract marks enforcement mechanizable, applies the enforcement that REFUSES a violation and fails the gate with the rule NAMED, before any reviewer sees it (O2). A rule marked enforcement review is reviewer guidance surfaced as a NON-BLOCKING note, never a gate refusal, the honest reading of mechanizable (NG5, the gate never carries a vacuous check). What is gate-blocking today, driven by this repository's contract labels, is the module size budget (the file_lines budget module_lines, max 1000, enforced over the CHANGED governed files, so a change that adds or grows a module past the budget refuses by name), and the engine invariants engine_byte_identical, derived_never_authoritative, and adoption_safe_fail_closed (wired to their catalog enforcement, check_pack_drift.py plus check_template_sync.sh, check_generated.sh, and this gate's own stand-down respectively, and refused if a named enforcing check is deleted so the enforcement can never silently vanish); an UNKNOWN mechanizable prose rule, or a mechanizable budget of an unknown kind, is REFUSED (the anti-vacuity rule C1, you cannot mark a rule mechanizable and enforce nothing). Review-lane today, honestly labeled and NOT gate-blocking, are the dependency and import boundaries, the function-length, duplication, and complexity budgets, and the remaining prose patterns and invariants; the D6 pluggable per-language slot ships stdlib reference implementations for the boundary, function-length, duplication, and complexity checks in .veldo/shape_gate.py, enforced only when the contract marks their rule mechanizable and the code is proven to pass, surfaced as notes until then (nothing flips a rule from review to mechanizable). Footprint versus diff (the O3 half deferred from W3) is enforced when the change set names exactly one footprinted spec, refusing a changed path outside that spec's declared footprint, and stands down for zero or more than one footprinted spec (green safe, no corpus re-sweep). CHANGE SCOPED, never a corpus sweep, so the already-shipped corpus is grandfathered exactly as W3's placement gate never re-sweeps shipped specs. Adoption safe (no contract stands the whole gate down) and fail closed (a malformed or unenforceable mechanizable rule refuses); reuses validate.parse_yamlish and arch.area_for_path plus the boundary-graph helpers, so no second parser, glob compiler, or boundary implementation. Gate-run via verify.sh and gate-tested with mutation teeth in selftest (WARP-1102). The entropy metrics and restoration for the decay class are WARP-1108/WARP-1109 (W8/W9)}
  incident_remedy_contracts:     {status: mechanical, home: .veldo/incident.py, note: the incident and remediation contracts and their structural validator (PLAN-0012 W1) - the two foundational artifacts of the production support responder. veldo.incident/v1 is the incident RECORD (the signal that broke, the affected behavior and softly the spec or area it traces to, the severity class from the method's one tier ladder, a timeline that carries the time-to-diagnosis, and a lifecycle status), and veldo.remedy/v1 is the remediation PROPOSAL (a diagnosis derived from artifacts, the evidence WITH query citations that supports it, the proposed whitelist action and its parameters, the risk class and the autonomy level the action needs, a reversibility analysis, a rollback plan, a canary shape, and the human authorization its execution will require). validate_incident and validate_remedy (in .veldo/incident.py, reusing validate.parse_yamlish and validate.fail, no second parser) check both structurally the way decision.py checks a decision record and FAIL CLOSED by name on a wrong schema, a missing or empty required field, an out-of-vocabulary status/severity/risk_class/autonomy_level/reversibility class/authorization, a timeline with no opened_at, a diagnosed or closed incident with no diagnosed_at or a diagnosed_at before the opened_at (a negative time-to-diagnosis), evidence with no citation, a proposed action with no action reference or parameters, and a malformed record. The SAFETY ARCHITECTURE is structural: a remedy is a PROPOSAL and the artifact carries NO execution capability, so a remedy that carries a self-execution or auto-apply field or whose status claims it executed is REFUSED (the proposal-not-execution invariant, O2/C4; execution is a separate organ, WARP-1206 W6); a proposal that omits its rollback plan or its required authorization is REFUSED (the two safety omissions); and anything classed irreversible or data-mutating must set required_authorization two_key, so the two-key path (WARP-1207 W7, a recorded human authorization plus an independent fresh-context confirmation) has something exact to bind to. bind_remedy fails closed when a remedy's incident does not resolve (referenced but absent). The event vocabulary gains the incident lifecycle (incident.opened, incident.diagnosed, remedy.proposed, incident.closed), owned here as INCIDENT_EVENT_TYPES and carried by .veldo/events.py with a selftest binding the two so they cannot drift; emission and the gate event-validator recognition are wired when incidents flow (WARP-1208 W8). Adoption safe: with no .veldo/incidents/ and no .veldo/remedies/ directory the check stands down and a repository that never configures the responder is byte-identically unaffected; the moment a record exists it fails closed, and a duplicate id within either set is refused. The RECORDS are per-repo (.veldo/incidents/ and .veldo/remedies/, directories the engine glob does not sweep) and are not shipped in the engine. Gate-tested with mutation teeth over the shipped incident-example.yaml and remedy-example.yaml plus temp-tree fixtures in selftest (WARP-1201). Landing the check into validate.py run_all and lay-down via init is WARP-1211 (W11, land the checks in the canonical engine); the evidence plane is WARP-1202 (W2), the intent corpus WARP-1203 (W3), the responder investigation loop WARP-1204 (W4), the action whitelist WARP-1205 (W5), the execution organ WARP-1206 (W6), and the two-key rule WARP-1207 (W7), all honestly out of scope here - this contract carries no execution capability}
  evidence_plane:                {status: mechanical, home: .veldo/evidence.py, note: the read-only evidence plane and its structural validator (PLAN-0012 W2) - where the production support responder investigates, built as read-only PHYSICS rather than a policy it follows. A per-repo source declaration (schema veldo.evidence/v1, homed under .veldo/evidence/*.yaml which the single-level .veldo/*.yaml engine glob does not sweep) declares one or more read-only sources, each a kind from the read-only vocabulary (logs, metrics, traces, read_replica and NEVER a primary), an access that must be read_only, a secret_ref that is a reference (env: or keychain:) and never a raw literal (D4), the templated query shapes it permits, a row cap, a rate cap, a timeout, and the sensitive fields it redacts before context. validate_plane (in .veldo/evidence.py, reusing validate.parse_yamlish and validate.fail, no second parser) FAILS CLOSED by name on a source declared as a primary or any out-of-vocabulary kind, an access that is not read_only, a secret given as a raw literal, a missing or non-positive row/rate/timeout quota, a source that declares no templated query shapes, and a duplicate source id. The CREDENTIAL SEAM is the physics: a ReadOnlyCredential yields only a ReadHandle whose sole operation is query (no write, insert, update, delete, execute, or mutate method exists on either type, so a write cannot be expressed), and even a raw crafted write submitted with the responder's credential is refused AT THE SEAM because the fake plane authorizes a write by the credential's granted role and a read-only credential grants only read (EvidenceWriteRefused, named), proven NON-VACUOUS since a write-granted credential the responder never holds applies the same write. Read-only is not harmless, so the read path is a Broker (not a raw connection): it enforces templated shapes (a free-form query is refused), a row-limit quota, a rate quota, and a per-query timeout, redacts the declared sensitive fields BEFORE rows enter context, and audits every query (allowed or refused) in a full QueryAudit. The live edge (LiveEvidencePlane) is a fail-loud reference seam mirroring executor.LiveLoop: every method raises EvidencePlaneError naming the deferral, so no live connection is opened in the gate and a runtime that wants live evidence injects a real adapter (NG1, live wiring is a separate per-system human-approved act). The secret reference is resolved at the seam and the raw secret never enters a context view, a repr, the audit log, a proof, or a returned row (C5). Dependency free (pathlib only) and starts no process, thread, or timer (NG3, no-detach). Adoption safe: with no .veldo/evidence/ directory the check stands down and a repository that never configures the responder is byte-identically unaffected; the CONFIGS are per-repo and not shipped in the engine. Gate-tested with mutation teeth (the credential-seam negative test goes red when the credential is granted write; a read-handle write-method injection, a dropped redact list, a free-form or over-quota or over-timeout query, and a detached-spawn injection each turn a check red) over the shipped evidence-sources-example.yaml plus in-memory fixtures in selftest (WARP-1202). Landing the check into validate.py run_all and lay-down via init is WARP-1211 (W11, land the checks in the canonical engine); the first consumer is the responder investigation loop WARP-1204 (W4), and the intent corpus WARP-1203 (W3), the action whitelist WARP-1205 (W5), the execution organ WARP-1206 (W6), and the two-key rule WARP-1207 (W7) are honestly out of scope here - the evidence plane reads and only reads, and has no write path, live or fake}
  intent_corpus:                 {status: mechanical, home: .veldo/intent_corpus.py, note: the intent corpus at runtime (PLAN-0012 W3) - the queryable index of the project's OWN recorded artifacts, so the production support responder does DIAGNOSIS FROM ARTIFACTS instead of diagnosis from memory. A read-only, in-session query surface (IntentCorpus, built by build_corpus/open_corpus) that INDEXES the existing record and introduces NO new store, NO new parser, and NO new instrumentation (NG5): it reuses the repo's own readers (validate.parse_yamlish for specs and plans, json for proofs and verdicts, validate.proof_digest for a proof's identity, validate.plan_registry for the plans, validate.load_repo_contract for the architecture contract, and .veldo/decision.py load_record for decision records), so there is one truth and no second parser. The queries: trace(spec) returns the governance chain (what the spec PROMISED, its acceptance criteria, what PROVED it, the proof with its criteria statuses, checks, bound commit, and proof digest, and the VERDICT that reviewed it, each CITING the real artifact path); governing_spec(behavior) resolves a behavior to its governing spec by recorded spec id or by declared footprint match; recent_changes(path) reads the change log from BOTH git (a synchronous in-session git log) AND the event stream (.veldo/events.jsonl, the events whose recorded commit matches); area_of(module) resolves a module to its architecture-contract area WHEN a PLAN-0011 contract exists and STANDS DOWN honestly to spec and git level without one (C7, never a faked area); proof_for_commit(commit) traces a change to what proved and reviewed it; decision(id) returns a recorded foundational decision; and trace_incident(incident) assembles the artifact-grounded trace an incident record resolves to (governing spec, criteria, proof, verdict, the recent changes touching its footprint, and the areas when a contract exists). The NO-FABRICATION guarantee is the product: a behavior no recorded artifact governs returns a truthful Trace(governed=False) naming no governing artifact and carrying NO invented spec, criterion, proof, or verdict, so an honest absence is never mistaken for a grounded answer. FAILS CLOSED by name on a malformed query (an empty or non-string spec id, path, behavior, or commit) and on a malformed corpus artifact (a spec with no front matter, a proof manifest that is not valid JSON), at build time. Adoption safe: a repository with no specs and no proofs builds an EMPTY corpus that stands down (every query returns an ungoverned Trace or an empty change list, no error, byte-identically unaffected). In-session and NO detached process (NG3, no-detach): the only external program it runs is a synchronous git log over this repository's own history, subprocess imported LAZILY exactly as fleet.py imports it for its git worktree helper, and it opens no connection to any live system. Gate-tested with mutation teeth (the no-fabrication guarantee goes red when the resolver fabricates a governor for an ungoverned behavior; proof-grounding goes red when a dropped proof is fabricated rather than reported absent; a malformed spec or proof and a malformed query each refuse; the empty-corpus stand-down; the C7 stand-down without a contract; and a detached-spawn injection turns the no-detach check red) in selftest (WARP-1203). The FIRST CONSUMER is the responder investigation loop WARP-1204 (W4), the in-session agent that reads this corpus and the evidence plane and produces a cited diagnosis and a proposal (this module is the query surface it reads, not the agent, and it emits no diagnosis or proposal); the evidence plane is WARP-1202 (W2), the action whitelist WARP-1205 (W5), the executor WARP-1206 (W6), and the two-key rule WARP-1207 (W7), all honestly out of scope here; landing a corpus check into validate.py run_all and lay-down via init is WARP-1211 (W11, land the checks in the canonical engine) - the corpus is a read and only a read}
  responder_loop:                {status: mechanical, home: .veldo/responder.py, note: the responder investigation loop at L0 (investigate) and L1 (propose) (PLAN-0012 W4) - the in-session agent harness and the FIRST CONSUMER of the three roots (the incident and remedy contracts WARP-1201 W1, the read-only evidence plane WARP-1202 W2, and the intent corpus WARP-1203 W3). Given an incident record (veldo.incident/v1) the harness (ResponderHarness) composes the corpus governance trace (trace_incident) and a read-only evidence handle (a query-only ReadHandle, W2 physics) into a veldo.responder_context/v1 investigation context and, through a DELEGATED fresh-context reasoning seam, reaches a CITED diagnosis; investigate is the L0 read (a cited Diagnosis, no proposal) and propose is the L1 emit (a validated veldo.remedy/v1 PROPOSAL). The LOAD-BEARING safety properties are STRUCTURAL, not instructed (Invention #3, O2/C4, the refusals are the product C1): the harness contains NO execution capability at all (no execute, apply, run, remediate, mutate, write, deploy, restart, or scale method exists on its type, and it holds only a read-only ReadHandle and no write-capable credential, so the write and execute path cannot even be expressed - execution is a separate organ, WARP-1206 W6, not built here); the ladder floor is read-only (constructed only at L0 or L1, REFUSING construction at the execution rungs L2 or L3 per D2, and propose requires L1 and at L0 degrades down never up per C3); and DIAGNOSIS FROM ARTIFACTS means every citation must resolve to a REAL artifact in the assembled context (a corpus artifact path the trace cites, a recorded change commit touching the governing spec footprint, or an evidence query actually issued and allowed by the broker) or the harness REFUSES by name (FABRICATED DIAGNOSIS REFUSED), and a governed incident must cite at least one corpus artifact so the answer rests on the record and not on evidence alone. The intelligent diagnosis is a delegated fresh-context step: the reference LiveResponder FAILS LOUD (raises ResponderError, never fabricates) exactly as executor.LiveLoop.build/review and the dispatch, shape, and decision reviewers refuse to fabricate their judgment, so an adopting runtime injects a responder that dispatches a genuinely fresh context. At L1 the emitted proposal is VALIDATED structurally through the W1 contract (INC.validate_remedy plus INC.bind_remedy, reusing the one parser, no second validator) so a proposal missing any element is refused (fail closed), and the required human authorization is DERIVED mechanically by the harness (irreversible or data-mutating forces two_key so the two-key path W7 has an exact binding, otherwise human_confirmation). Graceful degradation with no PLAN-0011 architecture contract (C7): the corpus stands down to spec and git level (areas None, contract_present false) and the harness still reaches a cited diagnosis. Dependency free (pathlib at module top, importlib LAZILY in the opener) and starts no process, thread, or timer (NG3, no-detach); reads a read-only handle over a FAKE plane offline and opens no live connection (NG1, live wiring is a separate per-system human-approved act). Gate-tested with mutation teeth (a subclass adding an execute method turns the no-execution check red; construction at L2 refuses while L0/L1 do not; a fabricated citation and a not-issued evidence citation each turn the grounding check red; and a detached-spawn injection turns the no-detach check red) over a seeded incident and a fake evidence plane in selftest (WARP-1204). The action whitelist WARP-1205 (W5), the execution organ WARP-1206 (W6), the two-key rule WARP-1207 (W7), the compressed loop and reconciliation WARP-1208 (W8), and the support metrics WARP-1210 (W10) are referenced, never implied built; landing a responder check into validate.py run_all and lay-down via init is WARP-1211 (W11, land the checks in the canonical engine) - the responder proposes and stops, and carries no execution capability}
  action_whitelist:              {status: mechanical, home: .veldo/action.py, note: the action whitelist - runbook actions as code, and the store that admits an action only after a recorded, digest-bound review (PLAN-0012 W5) - the third pillar of Invention #3 on the execution side. veldo.action/v1 is a pre-vetted, parameterized runbook action (validated in .veldo/action.py, reusing validate.parse_yamlish and validate.fail, no second parser) declaring the system it acts against (a FAKE system here, NG1), typed parameter specs each with a validation constraint (an enum, a numeric range, a string pattern), a risk class, a reversibility (class, analysis, data_mutating), a rollback plan, and canary support. validate_action FAILS CLOSED by name on a wrong schema, a missing id/title/system, an out-of-vocabulary risk_class/reversibility class/parameter type/review status/review verdict, a malformed parameter spec (no name, no enum values, an inverted min/max range, an uncompilable pattern), a missing rollback, a missing canary declaration (or a supported canary with no shape), and a missing or malformed review. THE DESIGN CENTER, fail closed (the refusals are the product C1): anything NOT in the whitelist DOES NOT EXIST TO THE MACHINE PATH (O2/C4, NG2) - an action reference is a whitelist KEY never command text, resolve_action of an unknown reference returns None with NO free-form fallback, and require_action REFUSES by name, so the machine can point only at a pre-vetted action and never at a crafted command; a present-but-unreviewed (proposed) action is likewise unresolvable. THE STORE REJECTS AN ACTION WITHOUT A RECORDED REVIEW - every action carries a review block and only a reviewed, approved, DIGEST-CURRENT action is admitted (action_reviewed); a reviewed action that was then EDITED is refused as STALE (review_stale, the reviewed_digest no longer matches action_digest, the WARP-0109 verdict-proof digest binding applied to a runbook action, so reviewed means reviewed EXACTLY THIS). A HIGH RISK FLOOR, NOTHING LOWERS A CLASS (C2) - being in the whitelist is an execution path so an action may not declare a class below high, and a data-mutating or irreversible action carries critical; a class below the floor is REFUSED (anything may raise a class, nothing may lower it). PARAMETERS ARE VALIDATED, OUT-OF-RANGE REFUSED BY NAME - validate_parameters refuses an unknown parameter, a missing required parameter, a wrong type, and a value outside the declared range/enum/pattern, each NAMING the parameter, so a malformed parameter never reaches the executor. veldo.action/v1 BINDS INTO veldo.remedy/v1 (W1) - bind_remedy_action resolves a remedy's proposed_action reference against the whitelist (unknown or unreviewed refuses, does not exist to the machine path) and validates its parameters (out-of-range refuses by name), reusing the remedy dict W1 already parsed - no second parser - and it RESOLVES and VALIDATES only, running NOTHING. The reference trio ships as illustrative EXAMPLES against FAKE systems (D3: restart a service, roll back a deploy, scale a pool, in .veldo/examples/action-*-example.yaml, root and engine only), each reviewed/approved/digest-current so the remedy example binds to rollback_deploy end to end. Adoption safe: with no .veldo/actions/ directory check_actions stands down and the effective whitelist is empty (a fresh repository has no admitted action until a human vets and promotes one), so a repository that never configures the responder is byte-identically unaffected; the RECORDS are per-repo (.veldo/actions/, a directory the engine glob does not sweep) and are not shipped in the engine. Dependency free (pathlib, plus json/hashlib for the action's own digest and re for a declared pattern) and starts no process, thread, or timer (NG3, no-detach). Gate-tested with mutation teeth over the shipped action examples plus temp-tree fixtures in selftest (WARP-1205): stripping the review block, dropping the rollback, declaring a class below the floor, and editing a reviewed action (stale digest) each turn a check RED, with positive controls so no check passes vacuously. This is HIGH RISK (C2) and ships at human_approval required; landing the check into validate.py run_all and lay-down via init is WARP-1211 (W11). The EXECUTOR that would run an action (on its own credentials and code path, bound to a proposal digest, with the autonomy ladder, kill switch, budgets, and canary-first) is WARP-1206 (W6) and the two-key rule is WARP-1207 (W7), both honestly out of scope here - this store carries NO execution capability and runs nothing}
  action_executor:               {status: mechanical, home: .veldo/action_executor.py, note: the execution organ - separate, privileged, laddered (PLAN-0012 W6) - the executor that can actually run a remediation, and the single most safety-critical organ on the execution side. This is NOT .veldo/executor.py (that is the VELDO build-loop executor, WARP-0401, executor_driver); it is a distinct organ, veldo.executor/v1 in .veldo/action_executor.py, that runs ONLY whitelisted actions with validated parameters BOUND TO A PROPOSAL DIGEST, on its OWN credential and code path, behind the standing safeguards, and FAILS CLOSED with the reason NAMED on every guard (the refusals are the product, C1/C3). SEPARATION IS STRUCTURAL (C4) - the executor runs on its OWN ExecutorCredential (a distinct type from the responder's read-only credential and ReadHandle, with no query/read method), holds a secret REFERENCE resolved at the shared D4 seam (evidence.resolve_secret_ref reused, never a raw literal, redacted in every string form, C5/D4), and shares no credential and no code path with the responder; it accepts a whitelist action reference plus validated parameters, NEVER command text, resolving the action through W5's store (action.require_action / validate_parameters reused, no second resolver, no second parser) and re-validating the proposal through W1 (incident.validate_remedy). THE AUTONOMY LADDER (O3, D2), constructed per system by a human and read by the executor which NEVER raises its own level (NG4) - L0 and L1 are the read-only floor and NEVER execute (refuse by name); L2 executes only provably-REVERSIBLE, non-data-mutating whitelisted actions after an explicit human confirmation bound to the proposal digest (a missing, non-confirming, machine-authored, or digest-mismatched confirmation refuses); L3 is DISABLED by default and, per D2, may never be enabled (a legitimate permanent state), and even if ever enabled auto-executes the LOWEST risk class alone, so because the whitelist floor is high (W5/C2) it auto-executes nothing. ANYTHING IRREVERSIBLE OR DATA-MUTATING ROUTES TO THE TWO-KEY RULE (WARP-1207, W7, now built): such an action executes ONLY with BOTH a recorded human authorization and an independent fresh-context confirmation, each bound to the proposal digest, and either key alone refuses; because W7 opens that data-mutating execution path it reaches the CRITICAL tier per C2, where W6 alone was HIGH. THE STANDING SAFEGUARDS - a KILL SWITCH any human trips instantly with no ceremony halts everything first and reset requires a recorded highest-tier approval (D5); an action BUDGET refuses once exhausted; a TIMEOUT refuses an over-budget run; and CANARY-FIRST where the action declares it, the canary demonstrably runs BEFORE the main action and a failed canary refuses without running it. The act against a real system is a DELEGATED seam (TargetSystem); the reference LiveTargetSystem FAILS LOUD and the FakeActionSystem is the offline proof (NG1), mirroring evidence.LiveEvidencePlane and executor.LiveLoop. Dependency free (pathlib/json/hashlib at module top, json/hashlib for the proposal's own digest proposal_digest, importlib lazily in the credential seam and the CLI) and starts no process, thread, or timer (NG3, no-detach); opens no live connection. Gate-tested with the FULL refusal suite as negative tests plus positive controls in selftest (WARP-1206): a non-whitelisted action, an invalid parameter, a below-floor level, a missing or foreign confirmation, a data-mutating or irreversible action, a tripped kill switch (and a reset without a highest-tier approval), an exhausted budget, and a timeout each refuse with the reason named, and a canary-declared action runs its canary FIRST and a failed canary does not run the main action, with a no-escalation and a no-detach mutation each turning a check red. This organ itself is HIGH RISK (C2) and shipped at human_approval required; the two-key rule that hardens it is WARP-1207 (W7, now built, CRITICAL because it opens the data-mutating path), the compressed loop and reconciliation WARP-1208 (W8), the support metrics WARP-1210 (W10), and landing an executor check into validate.py run_all and lay-down via init is WARP-1211 (W11), all referenced never implied built - the executor routes anything that would need the two keys to the two-key gate (WARP-1207)}
  two_key_rule:                  {status: mechanical, home: .veldo/two_key.py, note: the two-key rule (PLAN-0012 W7) - the second key path on top of the execution organ, and the gate through which an IRREVERSIBLE or DATA-MUTATING remediation may finally execute. For any action classed irreversible or data-mutating (or a remedy whose required_authorization is two_key) the executor (WARP-1206, W6) no longer dead-ends: it routes to this gate (.veldo/two_key.py, veldo.two_key/v1, reused - no second gate), and execution requires BOTH keys, each BOUND TO THE PROPOSAL DIGEST (never command text, C4). KEY 1 is a recorded HUMAN AUTHORIZATION (the veldo.approval-style record extended to bind to a proposal digest rather than a commit): a human decides approved and the record binds to the exact proposal_digest; a MACHINE-authored key 1 refuses (key 1 is a human, NG4). KEY 2 is an INDEPENDENT FRESH-CONTEXT CONFIRMATION (the veldo.verdict-style review pattern extended to remediation): a fresh context that did NOT propose the remedy confirms both that the DIAGNOSIS SUPPORTS THE ACTION and that the ACTION DOES ONLY WHAT IT CLAIMS, and the verdict binds to the same proposal_digest; a SELF-authored key 2 refuses (the confirmer cannot be the proposer/producer, the executor's actor, the human authorizer, or a responder/executor organ identity - the independent-review self-separation extended to remediation, NG4). EITHER KEY ALONE REFUSES (fail closed, degrade DOWN never up, C3): a human authorization without the confirmation, a confirmation without the authorization, a key bound to a DIFFERENT proposal digest (foreign or stale), a key naming a foreign incident, and an expired key each refuse with a NAMED reason from the closed taxonomy (requires_two_key when both are absent - the exact value the W6 fence used, bound by selftest to action_executor.REFUSE_REQUIRES_TWO_KEY so it cannot drift; missing_human_authorization, missing_independent_confirmation, authorization_not_granted, confirmation_not_granted, self_authorization_refused, confirmation_not_independent, foreign_authorization, foreign_confirmation, authorization_expired, confirmation_expired). Only when BOTH keys are present, granting, unexpired, self-separated, and bound to the SAME proposal digest does the executor run the action against the FAKE system (canary-first where declared), so the two-key success is real (the fake op log shows the action ran) and removing either key reverts to refusal. RISK: because this organ OPENS the irreversible/data-mutating execution path (behind the two keys), it reaches the CRITICAL tier per C2 (two independent reviews plus a recorded founder approval to land), where W6 was HIGH precisely because it built no such path. REUSE AND SEPARATION (C4/C6): a PURE gate over already-parsed records - it computes no digest (the executor computes it with W6's proposal_digest, the ONE canonical binding, and passes it in; the CLI reuses that same function so the binding has one truth) and parses no file, reuses W5's risk/reversibility classes through the executor, holds no credential, opens no connection, and starts no process, thread, or timer (NG3, no-detach); dependency free (pathlib and json at module top for the standalone demo only, importlib lazily). Gate-tested with the full two-key conformance suite plus mutation teeth in selftest (WARP-1207): each missing-key path, the digest-mismatch, the expired, the foreign-incident, the machine-authored, and the self-authored refusals each turn red with green positive controls, the both-keys path executes on the fake system, and neutralizing each guard in an in-memory copy lets a refused case through (the real module byte-unchanged). Everything offline against fake systems (NG1); the compressed loop and reconciliation that would DRIVE an incident through this gate are WARP-1208 (W8), the support metrics WARP-1210 (W10), and landing a check into validate.py run_all plus the init lay-down is WARP-1211 (W11), all referenced never implied built}
