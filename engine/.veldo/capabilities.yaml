  review_event_projection:       {status: mechanical, home: .veldo/events.py + scripts/verify.sh, note: the review loop's events are DERIVED from the verdict artifacts that already exist, never appended by whoever remembers (WARP-0722). A HAND-EMITTED verdict.recorded IS REFUSED ON EVERY ROUTE THE SELFTEST DRIVES, and the universal `CANNOT LAND` is gone from this note because it was MEASURED FALSE: a `str` SUBCLASS whose `__hash__` and `__eq__` make both membership tests miss while `json.dumps` writes the owned name lands such a line in process. That needs arbitrary in-process Python, which already permits appending to the file directly, so it is a DECLARED LIMIT and no defence is built for it. What refuses on the driven routes: the ONE function in the module that puts bytes in the log reads `type` OFF THE ASSEMBLED DICT, after every merge, extra and CLI --field has been applied, and refuses a projection-owned type whose own content key is not one this pass derived from a COMMITTED artifact of the repository the log belongs to - so entitlement is structural and not a string, and emit() holds none of it. THE TYPE IS READ OFF THE BYTES BECAUSE EVERY EARLIER PLACEMENT GUARDED A DESCRIPTION OF THE EVENT: round 5 the constructor (a second constructor was left underneath it and a writer through it appended the harmful line with the suite green), round 6 emit()'s type ARGUMENT (defeated by `--field type=verdict.recorded`, which merges last, at exit 0 with the contract validator green and every genuine verdict of that spec withheld from then on). The vocabulary check moved onto the bytes for the same reason: an argument check let `--field type=` write a line no validator recognises into an append-only log. make_event does not refuse - building an envelope appends nothing - and a caller that builds a line and appends it ITSELF is a writer OUTSIDE this module that no check inside it can reach; TWO such writers are driven in the selftest and nothing there enumerates the rest, so no exhaustiveness is claimed over them: the mechanical completeness leg is over .sh files only, and .veldo/reconciliation_store.py appends to this log without importing this module and is neither named nor driven. The write surface is asserted with NEITHER SIDE WRITTEN DOWN: off the module's own AST, the write set is DISCOVERED by resolving what each byte emission TARGETS (the log, found by DRIVING a copy of the module in a tree of its own and taking the globals its appended bytes were observed to follow, plus those paths' own components) and the refusal set by what those functions DO (raise on every projection-owned type, return on every other declared one), and every scope emitting bytes to the log must have a refusal on every path into it. Naming either side was a pin on a moving repository property twice over: round 6 named the writers and an ordinary extract-a-helper refactor reddened the gate, then round 7 named the refusals and a pure rename raised AttributeError with NO pass/fail summary printed at all, which takes the gate's reporting down, and round 8 then required the module to hold EXACTLY ONE json-lines global - a CARDINALITY THIS REPOSITORY CAN GROW - which one purely additive unused global beside the log turned into a traceback with no summary again. No set here is a name or a count: the log is discovered by driving the module and the property is required of each global the bytes follow. The refusal does not consult the caller-supplied `producer` field, because a string the caller chooses is not a credential. AN EVENT LOG IS ALSO THE PROJECTION OF ONE WORK TREE: the artifacts and the log are compared by THE NEAREST ENCLOSING REPOSITORY GIT REPORTS FOR EACH PATH and a disagreement is REFUSED and reported by name (measured shipped: `--repo-root <attacker dir> --log <this log>` imported forged events at exit 0), so a repository created ABOVE this one cannot claim its log - and that answer is one the PROCESS ENVIRONMENT CAN REDIRECT, measured: GIT_DIR and GIT_WORK_TREE pointed at an attacker's repository make git report one toplevel for both and a forged verdict lands at exit 0, which needs environment control that already permits appending to the file directly; keying the origin into the event was rejected because an unresolvable line declaring this projection's producer imports a permanent WITHHOLD instead of a forged pass. reconcile_verdicts enumerates its domain at run time from `git ls-files 'proof/*/verdict*.json'`, the same mechanism the lint stage uses for its corpus, so the domain grows with the repository and no count is written down; it appends one verdict.recorded event (a type the vocabulary already declared) per COMMITTED verdict artifact whose review the log does not already carry. THE IDEMPOTENCE KEY IS (type, spec id, THE ARTIFACT'S OWN BLOB SHA), so it identifies a REVIEW rather than a file: content-addressed, therefore identical at every clone depth, different when the review is different, and unmoved when the file is renamed. Round 1 keyed on the path plus the sha of the commit that ADDED it and an independent review broke that twice - an artifact AMENDED IN PLACE (this repository's own convention across review rounds) kept publishing the superseded result, and a --depth 1 clone of ONE commit derived a different key for every artifact because an add lookup in a grafted history attributes every path to the shallow tip. Every substantive field is read from the artifact's bytes AT THAT BLOB with `git cat-file blob`: the verdict, the round, the commit the verdict SAYS IT REVIEWED, and the event's `at`. TWO CLONES OF ONE COMMIT THEREFORE RENDER BYTE-IDENTICAL EVENTS, WITH ONE DECLARED EXCEPTION STATED HERE RATHER THAN TWO SENTENCES LATER: `at` is the review's OWN reviewed_at when the artifact declares one in this envelope's format, and otherwise the RECONCILIATION time - counted, reported, and the only field two clones may differ on, never the key. That branch is reachable rather than theoretical, because the SHIPPED verdict example declares no reviewed_at and validate.py does not require it, and both branches are exercised by fixtures. THE `at` IS ALSO AUTHOR-CONTROLLED AND VALIDATED NOWHERE (no format, plausibility or adding-commit cross-check; 1970 and 2099 both commit green, and the corpus already carries a future-dated review), which is accepted because `at` is payload and never key, so a forged timestamp can only misorder a chronology - the artifact-side rule that would close it is a contract tightening with its own item. WHAT IT WILL NOT GUESS AT is NAMED and skipped: an artifact staged but not committed, and an EARLIER event OF ITS OWN whose (commit, path) pair this repository can no longer resolve - the shape a shallow clone produces - which withholds the appends for THAT SPEC alone rather than duplicating a backfill it cannot see. A SEPARATE DECISION READS THAT SAME STRING, AND SAYS SO RATHER THAN CLAIMING OTHERWISE: an unresolvable verdict event already in a log is classified by the producer IT DECLARES, because for a line written before the content key existed an append-only log offers no other discriminator - one declaring the reconciler withholds that spec, one declaring anything else is reported BY NAME and withholds nothing. That is a declared limit, not a credential check: the field is author-written, so a hand-written line declaring the reconciler's producer withholds that spec, which is why the refusal on the bytes above exists and why a log that already carries such a line cannot take it back. Old-form events are resolved in ONE `git cat-file --batch-check -z` call rather than one subprocess each (the per-event form spent one process on every old-form event and most of the stage's wall clock on startup; the figures are in proof/WARP-0722/manifest.json, each against the revision it was taken at), with the per-event route kept as a fallback and a selftest asserting the two agree. The read-then-append window is held under an EXCLUSIVE NON-BLOCKING lock on the log's own descriptor, so two concurrent reconciliations cannot both append, neither ever waits, and a killed holder leaves nothing stale. The gate (scripts/verify.sh) calls it in the always-run built-in section, because what it replaces was a prose instruction in skills/review asking the reviewer to append the event by hand, which named two types the validator never declared and which no verdict in the corpus was ever recorded under. It APPENDS AND REPORTS and never touches FAIL: a stage that reddened the build over its own bookkeeping would make the first run after it lands unlandable. What it publishes INSTEAD of a verdict is an integrity line - deferrals with their reasons, unresolvable earlier events NAMED rather than counted and the appends withheld for them, duplicate keys already in the log, artifacts ABSORBED by an identical review already keyed, superseded reviews, events dated at reconciliation, the shallow flag and the lock state - because never reddening is right and publishing no signal at all is not. NO CONSUMER ships with it, and two readers already consume verdict.recorded: .veldo/metrics.py (safe, it sorts by `at` and its tallies are order-free, though it tallies the LOG and so over-counts by any pre-existing duplicate until reader-side dedup lands with the metrics split) and .veldo/runstatus.py (which slices by FILE POSITION, a pre-existing defect on a log that was never monotonic, with its own item). Gate-tested in selftest (WARP-0722) over the real corpus and over fixture repositories: the derived key set EQUALS the git enumeration in both directions, what the event records EQUALS what the repository committed for every artifact over the declared partition (checked through a different git command than the projection uses, with the event-derived and artifact-derived verdict tallies asserted equal), FIVE clone shapes of one commit derive identical keys and byte-identical events with the mtimes forced 30 years apart, moving the CLOCK moves only the fallback's `at` and never a key or an id, an amendment in place appends exactly one further event and a rename appends none, two byte-identical artifacts of one spec append ONE event with the absorbed one counted while the same two a second apart append two, a merge-only add is keyed like any other, a staged verdict is deferred by name, a shallow clone with no earlier events reconciles normally while one carrying an unresolvable event withholds only that spec, the batch resolution is asserted equal to the per-event route over the whole log, a second and third run append ZERO lines with the earlier content still a PREFIX of the file, and a locked log makes a concurrent run append nothing and say so}
