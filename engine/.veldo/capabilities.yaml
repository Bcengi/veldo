  incident_reconciliation:       {status: mechanical, home: .veldo/incident_reconcile.py, note: incident as intent - the compressed loop and RECONCILIATION (PLAN-0012 W8, outcome O5). A closed incident is not a restored service, it is a SETTLED PIECE OF INTENT: this organ (.veldo/incident_reconcile.py plus its ONE IMPURE EDGE, the sibling .veldo/reconciliation_store.py which owns the receipt store, the draft writes, the compare-and-swap and the draft path guard; record schema veldo.reconciliation/v1, stdlib only) runs AFTER an incident is diagnosed and any remediation already executed, and it settles the incident or REFUSES BY NAME. failure_signature is a DETERMINISTIC, PURE digest over exactly the identity-of-failure fields (affected_behavior and signal whitespace-normalized and case-folded, plus affected_spec and affected_area when carried), so the same failure shares a signature while a different title, severity, timeline, or id does not change it and the digest is identical across processes; recurrence returns the ORDERED prior ids sharing it, excluding the incident itself and SKIPPING any record whose signature cannot be computed, and a non-empty set is reported as what the method already calls it - recurrence_of plus missing_specification true, an emergency that recurs is a MISSING SPECIFICATION. THE CLOSE GATE FAILS CLOSED on six independent conditions, each a named refusal from the closed REFUSALS taxonomy: a status that is not diagnosed (incident_not_diagnosed; an already-closed incident takes the idempotent replay path instead), a MISSING human diagnosis validation (missing_diagnosis_validation - the diagnosis is validated by a HUMAN and its absence never defaults open), a MACHINE actor as validator (machine_validated_diagnosis, the actor set REUSED from the shipped authorization.MACHINE_ACTORS so the responder can never validate its own diagnosis, NG4), a validation that BINDS NO REMEDY while a remedy exists (validation_binds_no_remedy - an attestation na