schema: veldo.policy/v1
version: 1
risk_tiers:
  low:      {gate: standard, reviews: 1, min_independence: L1, human_approval: false}
  standard: {gate: full,     reviews: 1, min_independence: L2, human_approval: false}
  high:     {gate: expanded, reviews: 1, min_independence: L2, human_approval: false}
  critical: {gate: expanded, reviews: 2, min_independence: L2, human_approval: true,
             prepare_and_execute: true}
# Independence rule for this repository (founder instruction, 2026-07-16,
# recorded verbatim in the operator's memory): reviews the operator initiates
# run on a fresh-context DIFFERENT Claude model (Opus family) - level L2 - at
# every tier; critical risk means two independent L2 verdicts. Cross-vendor
# review (the generic ladder's L3/L4) happens ONLY on the founder's explicit
# per-case instruction; no agent may invoke another vendor's model on its own
# initiative.
protected_paths:
  # VELDO-0272, owner decision 2026-11-07 (Telegram 39707, 39708; ready 39747): the owner's approval
  # is kept for money, authentication and security, schema and irreversible infrastructure, and this
  # list holds only paths in those categories. Test machinery (the gate, its reuse, mutation,
  # sandbox, leg, schedule and host machinery, the suite dispatcher and .veldo/floors/*) left the
  # list: a change to it lands on a green gate and a recorded independent review, and the daily
  # summary (.veldo/landed_summary.py) names it. A schema change is caught by risk_areas: [schema]
  # in the spec, because the store schema is written inline in files routine work also touches.
  #
  # Security: the approval rule itself, and the push guard that runs it.
  - {path: ".veldo/policy.yaml", floor: high}
  - {path: ".veldo/policy_check.py", floor: high}
  - {path: "engine/.veldo/policy_check.py", floor: high}
  - {path: "scripts/veldo-guard.sh", floor: high}
  - {path: "engine/scripts/veldo-guard.sh", floor: high}
  # Security: the runner that judges a candidate by the installed policy and trunk base (VELDO-0058),
  # so a candidate cannot empty this list, and the authority owned Git boundary that keeps a
  # candidate from moving the refs the push range is read from.
  - {path: ".veldo/control_verification.py", floor: high}
  - {path: "engine/.veldo/control_verification.py", floor: high}
  - {path: ".veldo/candidate_git.py", floor: high}
  - {path: "engine/.veldo/candidate_git.py", floor: high}
  # Security: a secret inventory disposition is an exemption from the secret scanner (CEO-113-era
  # decision, 2026-08-03), so adding one is a reviewed change no agent takes on its own behalf.
  - {path: ".veldo/secret_inventory.json", floor: high}
  # Authentication: a settlement records what a named human said (VELDO-0012), so no agent may
  # author one in his name.
  - {path: ".veldo/settlements/*", floor: high}
  # Authentication and security (VELDO-0272, added): authorization, authority, two-key, membership,
  # WebAuthn, credentials, signers, keys and secret references, each with its engine copy.
  - {path: ".veldo/authorization.py", floor: high}
  - {path: "engine/.veldo/authorization.py", floor: high}
  - {path: ".veldo/authority_contract.py", floor: high}
  - {path: "engine/.veldo/authority_contract.py", floor: high}
  - {path: ".veldo/two_key.py", floor: high}
  - {path: "engine/.veldo/two_key.py", floor: high}
  - {path: ".veldo/control_membership.py", floor: high}
  - {path: "engine/.veldo/control_membership.py", floor: high}
  - {path: ".veldo/control_api_webauthn.py", floor: high}
  - {path: "engine/.veldo/control_api_webauthn.py", floor: high}
  - {path: ".veldo/control_api_credentials.py", floor: high}
  - {path: "engine/.veldo/control_api_credentials.py", floor: high}
  - {path: ".veldo/control_api_signer.py", floor: high}
  - {path: "engine/.veldo/control_api_signer.py", floor: high}
  - {path: ".veldo/control_signer.py", floor: high}
  - {path: "engine/.veldo/control_signer.py", floor: high}
  - {path: ".veldo/control_signer_answers.py", floor: high}
  - {path: "engine/.veldo/control_signer_answers.py", floor: high}
  - {path: ".veldo/control_keys.py", floor: high}
  - {path: "engine/.veldo/control_keys.py", floor: high}
  - {path: ".veldo/control_keys_custody.py", floor: high}
  - {path: "engine/.veldo/control_keys_custody.py", floor: high}
  - {path: ".veldo/control_credential.py", floor: high}
  - {path: "engine/.veldo/control_credential.py", floor: high}
  - {path: ".veldo/control_credential_keystore.py", floor: high}
  - {path: "engine/.veldo/control_credential_keystore.py", floor: high}
  - {path: ".veldo/control_credential_delivery.py", floor: high}
  - {path: "engine/.veldo/control_credential_delivery.py", floor: high}
  - {path: ".veldo/credential_issue.py", floor: high}
  - {path: "engine/.veldo/credential_issue.py", floor: high}
  - {path: ".veldo/secretref.py", floor: high}
  - {path: "engine/.veldo/secretref.py", floor: high}
  # Money (VELDO-0272, added): the module that enforces spend on paid model accounts.
  - {path: ".veldo/budget.py", floor: high}
  - {path: "engine/.veldo/budget.py", floor: high}
# VELDO-0016 (PLAN-0019 W1), 2026-09-17: this repository's architecture contract is REQUIRED.
# The loader (validate_checks.load_contract_state) reads this one line; with it, an absent
# .veldo/architecture.yaml refuses the ready transition, the frontier, run-check and the shape
# gate instead of standing them down as "adoption safe", which is the right answer for a
# repository that has a contract and depends on it. A repository that never adopted a contract
# leaves the line out (or says optional) and is unaffected.
architecture_contract: required
# VELDO-0104 and VELDO-0105, set by Dmitry on 2026-09-21 over Telegram: the flag (message 28433,
# answering 28432) and the start line (28436, answering 28434, and the landing approval 28449).
#
# required: the proof check REFUSES a bundle whose item was fixed after its review and carries no
# validation record, or whose validation does not close every finding on all four runner results and
# the assessor's verdict, or whose fix rounds exceed the cap. Off, every one of those is a warning.
#
# from_commit: where the rule STARTS. It is the commit that landed VELDO-0105, so the first bundle it
# binds is the next one after that, and the thirteen bundles that shipped before the runner and the
# assessor existed are not re-judged. Absence fails CLOSED: remove this line and every bundle is in
# scope again, which is the behaviour VELDO-0104 shipped.
#
# This file is a protected path, so only the owner sets either of these and no agent can exempt
# itself from the rule it is being gated by.
fix_validation:
  required: true
  from_commit: 5c6473325b19604b9b1d28b8af8eb488a4a64e8c
# VELDO-0272, set by Dmitry on 2026-11-07 (Telegram 39707, 39708; ready 39747): where the computed
# approval flag STARTS. The validator judges every spec first committed after this commit by the rule
# (approval_flag_below_rule, critical_without_area); a spec first committed at or before it keeps its
# declared flag. Read exactly as fix_validation.from_commit is read: absent, not a forty character
# commit id, or not a commit in this repository, and EVERY spec is in scope (fail closed). It records
# the commit that lands VELDO-0272; at build time it names the branch's base, and the landing points
# it at the landing commit.
approval_scope:
  from_commit: ed0c995f446f9bfd6050bfb0f5434adee1a91a6f
merge_rule: >
  Auto-merge if and only if: the specification is ready and valid; every
  acceptance criterion is passed in a valid proof manifest for this exact
  commit; all mandatory checks pass; the effective risk tier permits
  auto-merge; every required approval is recorded, unexpired, and bound to
  this commit; and the change is classified reversible. If the trunk moved
  since the gate ran, the gate re-runs on the merged result before the merge
  completes. Reuse-aware stamps and events must declare honest counts. Positive mutation reuse
  requires authenticated non-agent provenance and per-case declared input keys bound
  to the gated commit under VELDO-0208. Force-fresh requires zero reused results.
  REVIEW CLAUSE (VELDO-0272, in place of the WARP-0730 no verdict clause).
  Owner approval is required for a change touching a protected path, and a
  spec whose approval flag is required (declared, or computed from its
  footprint and risk areas) is not merge ready without him. A push whose specifications are all
  not_required and that touches no protected path lands on a green gate and,
  per specification, a pass or pass_with_notes verdict with no blocking
  findings, bound to a commit in the push and to the specification's current
  proof digest, from a reviewer who is not the proof producer; without one
  the push is refused landing_without_review. The limit is stated, not
  hidden: a verdict is a file an agent can write. The reviewer identity check
  and the owner's daily summary of what landed make a forged review visible,
  not impossible. A recorded objection still blocks, and the owner is still
  the authority for anything touching a protected path.
emergency:
  lane: fix forward with a human engaged
  backfill_hours: 24
