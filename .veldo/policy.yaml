schema: veldo.policy/v1
version: 1
risk_tiers:
  low:      {gate: standard, reviews: 1, min_independence: L1, human_approval: false}
  standard: {gate: full,     reviews: 1, min_independence: L2, human_approval: false}
  high:     {gate: expanded, reviews: 1, min_independence: L2, human_approval: true}
  critical: {gate: expanded, reviews: 2, min_independence: L2, human_approval: true,
             prepare_and_execute: true}
# Independence rule for this repository (founder instruction, 2026-07-16,
# recorded verbatim in the operator's memory): reviews the operator initiates
# run on a fresh-context DIFFERENT Claude model (Opus family) - level L2 - at
# every tier; critical risk means two independent L2 verdicts. Cross-vendor
# review (the generic ladder's L3/L4) happens ONLY on the founder's explicit
# per-case instruction; no agent may invoke another vendor's model on its own
# initiative.
protected_paths:
  # The enforcement core: this repository ships the templates every adopting
  # repository trusts. Weakening the gate, the guard, or the policy here
  # propagates everywhere, so those exact files are the protected surface.
  # Deliberately narrow: validators and skills change with ordinary specs.
  - {path: "scripts/verify.sh",                  floor: high}
  - {path: "scripts/veldo-guard.sh",              floor: high}
  - {path: ".veldo/policy.yaml",                  floor: high}
  - {path: "engine/scripts/verify.sh", floor: high}
  - {path: "engine/scripts/veldo-guard.sh", floor: high}
  - {path: ".veldo/policy_check.py",                  floor: high}
  - {path: "engine/.veldo/policy_check.py", floor: high}
  # CEO-113-era decision, 2026-08-03: the secret inventory record carries the DISPOSITIONS,
  # and a disposition is a security exemption. Protecting it means adding one is a reviewed
  # change rather than a step an agent can take on its own behalf, which is the only thing
  # that makes the per-digest design trustworthy. Dmitry approved this the same hour he
  # approved the flip to enforcing.
  - {path: ".veldo/secret_inventory.json",        floor: high}
  # VELDO-0012, the behaviour floor: the SAME registration and the SAME argument the
  # secret inventory records two lines above. A floor pins an existing codebase's current
  # behaviour, and a settlement is the record of what a named human SAID about one of
  # those pins, so a settlement is an exemption in exactly the way a secret disposition
  # is. The validator is not the integrity: the integrity of a disposition record is the
  # integrity of a reviewed change plus the protected-path rules it sits under, never its
  # own validation. With these two registered, adding a floor, re-pointing an observation
  # or writing a settlement is a change that needs a commit-bound, path-scoped approval,
  # so the agent being gated cannot author the record that exempts it.
  - {path: ".veldo/floors/*",                     floor: high}
  - {path: ".veldo/settlements/*",                floor: high}
# VELDO-0016 (PLAN-0019 W1), 2026-09-17: this repository's architecture contract is REQUIRED.
# The loader (validate_checks.load_contract_state) reads this one line; with it, an absent
# .veldo/architecture.yaml refuses the ready transition, the frontier, run-check and the shape
# gate instead of standing them down as "adoption safe", which is the right answer for a
# repository that has a contract and depends on it. A repository that never adopted a contract
# leaves the line out (or says optional) and is unaffected.
architecture_contract: required
# VELDO-0104 and VELDO-0105, set by Dmitry on 2026-09-21 over Telegram: the flag (message 28433,
# answering 28432) and the start line (28436, answering 28434, and the landing approval 28449).
#
# required: the proof check REFUSES a bundle whose item was fixed after its review and carries no
# validation record, or whose validation does not close every finding on all four runner results and
# the assessor's verdict, or whose fix rounds exceed the cap. Off, every one of those is a warning.
#
# from_commit: where the rule STARTS. It is the commit that landed VELDO-0105, so the first bundle it
# binds is the next one after that, and the thirteen bundles that shipped before the runner and the
# assessor existed are not re-judged. Absence fails CLOSED: remove this line and every bundle is in
# scope again, which is the behaviour VELDO-0104 shipped.
#
# This file is a protected path, so only the owner sets either of these and no agent can exempt
# itself from the rule it is being gated by.
fix_validation:
  required: true
  from_commit: 5c6473325b19604b9b1d28b8af8eb488a4a64e8c
merge_rule: >
  Auto-merge if and only if: the specification is ready and valid; every
  acceptance criterion is passed in a valid proof manifest for this exact
  commit; all mandatory checks pass; the effective risk tier permits
  auto-merge; every required approval is recorded, unexpired, and bound to
  this commit; and the change is classified reversible. If the trunk moved
  since the gate ran, the gate re-runs on the merged result before the merge
  completes.
  NO VERDICT CLAUSE (WARP-0730). The rule used to also require a pass verdict
  with zero blocking findings. A verdict is an artifact the agent can write,
  so that clause asked an agent to certify itself and cost nine build rounds
  of forgery guards. The gate is the authority for ordinary work and the owner
  is the authority for anything touching a protected path; reviews still run
  and report, they no longer certify.
emergency:
  lane: fix forward with a human engaged
  backfill_hours: 24
